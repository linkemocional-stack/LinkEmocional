<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear mi página | Link Emocional</title>
<meta name="description" content="Elige un diseño, escribe tu mensaje y obtén tu enlace en minutos. 16 horas gratis.">
<link rel="icon" type="image/jpeg" href="og-image.jpg">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="thumbs.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js">
<script src="protection.js"></script>
</head>
<body>
<canvas id="stars"></canvas>
<header id="top"></header>

<main class="page wide">
  <div id="qbanner" style="margin-top:18px"></div>
  <!-- PASO 1: elegir diseño -->
  <section id="stepPick">
    <h1 class="t">Elige tu <em>diseño</em></h1>
    <p class="sub">Escribe tu mensaje, sube tus fotos y recibe tu enlace en minutos. Es <b>gratis por 16 horas</b> y después la puedes hacer permanente.</p>
    <div class="grid" id="grid"><div class="spin"></div></div>
  </section>

  <!-- PASO 2: editor -->
  <section id="stepEdit" class="hidden">
    <h1 class="t" id="edTitle"></h1>
    <p class="sub" id="edSub"></p>
    <div class="tabs" id="tabs">
      <button data-t="edit" class="on">✏️ Editar</button>
      <button data-t="prev">👁 Vista previa</button>
    </div>
    <div class="ed" id="ed">
      <div class="pane-edit" id="form"></div>
      <div class="pane-prev">
        <div class="phone" id="phone"><div class="ph">La vista previa aparece aquí</div></div>
        <div class="row" style="margin-top:14px;max-width:360px;margin-left:auto;margin-right:auto">
          <button class="btn ghost sm" id="bFull">⛶ Probar en pantalla completa</button>
        </div>
        <p class="muted center" style="margin:10px 0 0">Toca la pantalla para empezar, igual que lo verá esa persona 👆</p>
      </div>
    </div>
  </section>
</main>

<div class="bar hidden" id="bar">
  <button class="btn ghost" id="bBack">← Diseños</button>
  <button class="btn" id="bCreate">✨ Crear mi página</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="thumbs.js"></script>
<script src="app.js"></script>
<script src="render-core.js"></script>
<script>
(function () {
  LE.header('crear');
  var $ = function (i) { return document.getElementById(i); };
  var qs = new URLSearchParams(location.search);
  var TPLS = [], tpl = null, cfg = null, editId = null, HTML = {};
  var PALETTE = ['#ff9ccf', '#ff8fb8', '#c86bff', '#8b6ff0', '#6fd6e8', '#ffd36b', '#ff7a70', '#9dffb0', '#ffffff'];
  var dirty = true, tPrev = 0, tDraft = 0, tab = 'edit';
  var desktop = function () { return window.matchMedia('(min-width:900px)').matches; };
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };

  /* ======================= utilidades ======================= */
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  var E = LE.esc;

  // Foto -> JPEG comprimido (para que la pagina no pese de mas)
  function photo(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onerror = rej;
      r.onload = function () {
        var img = new Image();
        img.onerror = rej;
        img.onload = function () {
          var max = 1000, q = .74, d;
          for (var i = 0; i < 6; i++) {
            var s = Math.min(1, max / Math.max(img.width, img.height));
            var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            d = c.toDataURL('image/jpeg', q);
            if (d.length <= 430000) return res(d);
            max = Math.round(max * .8); q = Math.max(.5, q - .06);
          }
          rej(new Error('big'));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
  function pickFiles(multiple, accept) {
    return new Promise(function (res) {
      var i = document.createElement('input'); i.type = 'file'; i.accept = accept || 'image/*'; i.multiple = !!multiple;
      i.onchange = function () { res(Array.prototype.slice.call(i.files || [])); };
      i.click();
    });
  }


  /* ---------- musica: comprime el MP3 en el navegador para que quepan varios minutos en ~2 MB ---------- */
  var AUDIO_TARGET = 2000000;           // bytes finales (el servidor acepta ~2.1 MB)
  var AUDIO_IN_MAX = 30 * 1048576;      // peso maximo del archivo original
  var LAME_URL = 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';
  function loadLame() {
    return new Promise(function (ok, fail) {
      if (window.lamejs) return ok();
      var s = document.createElement('script'); s.src = LAME_URL;
      s.onload = function () { window.lamejs ? ok() : fail(); }; s.onerror = fail;
      document.head.appendChild(s);
    });
  }
  function tick() { return new Promise(function (r) { setTimeout(r, 0); }); }
  function compressAudio(file, onProgress) {
    var RATE = 32000, KBPS = [96, 80, 64, 56, 48, 40, 32];
    return Promise.all([loadLame(), file.arrayBuffer()]).then(function (r) {
      var AC = window.AudioContext || window.webkitAudioContext, ctx;
      try { ctx = new AC({ sampleRate: RATE }); } catch (e) { ctx = new AC(); }
      return new Promise(function (ok, fail) { ctx.decodeAudioData(r[1], ok, fail); }).then(function (buf) {
        try { ctx.close(); } catch (e) {}
        var dur = buf.duration, kbps = 0;
        for (var i = 0; i < KBPS.length; i++) { if (KBPS[i] * 1000 / 8 * dur <= AUDIO_TARGET) { kbps = KBPS[i]; break; } }
        if (!kbps) { var max = Math.floor(AUDIO_TARGET / (32000 / 8) / 60 * 10) / 10; throw new Error('long:' + max); }
        /* a mono y a RATE (si el navegador no remuestreo) */
        var ch = buf.numberOfChannels, len = buf.length, src = buf.sampleRate, mono = new Float32Array(len);
        for (var c = 0; c < ch; c++) { var d = buf.getChannelData(c); for (var n = 0; n < len; n++) mono[n] += d[n] / ch; }
        var pcm;
        if (src === RATE) { pcm = mono; }
        else { var outLen = Math.floor(len * RATE / src); pcm = new Float32Array(outLen); var k = src / RATE;
          for (var o = 0; o < outLen; o++) { var pos = o * k, i0 = Math.floor(pos), f = pos - i0; pcm[o] = mono[i0] * (1 - f) + (mono[i0 + 1] != null ? mono[i0 + 1] : mono[i0]) * f; } }
        var i16 = new Int16Array(pcm.length);
        for (var j = 0; j < pcm.length; j++) { var v = Math.max(-1, Math.min(1, pcm[j])); i16[j] = v < 0 ? v * 32768 : v * 32767; }
        var enc = new lamejs.Mp3Encoder(1, RATE, kbps), parts = [], size = 0, B = 1152, pos2 = 0;
        function step() {
          var t0 = Date.now();
          while (pos2 < i16.length && Date.now() - t0 < 30) {
            var out = enc.encodeBuffer(i16.subarray(pos2, pos2 + B)); pos2 += B;
            if (out.length) { parts.push(new Int8Array(out)); size += out.length; }
          }
          if (onProgress) onProgress(Math.min(100, Math.round(pos2 / i16.length * 100)));
          if (pos2 < i16.length) return tick().then(step);
          var end = enc.flush(); if (end.length) { parts.push(new Int8Array(end)); size += end.length; }
          return new Blob(parts, { type: 'audio/mpeg' });
        }
        return tick().then(step);
      });
    });
  }

  /* ======================= campos del editor ======================= */
  function changed() { dirty = true; schedulePreview(); scheduleDraft(); }

  function field(spec, obj, key) {
    var w = h('div', 'fld'), type = spec.type;

    if (type === 'text' || type === 'date') {
      w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
      var i = h('input', 'in'); i.type = type === 'date' ? 'date' : 'text'; if (spec.max) i.maxLength = spec.max;
      i.value = obj[key] == null ? '' : obj[key];
      i.oninput = function () { obj[key] = i.value; changed(); };
      w.appendChild(i);
    }
    else if (type === 'textarea') {
      w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
      var t = h('textarea', 'in'); if (spec.max) t.maxLength = spec.max; if (spec.rows) t.rows = spec.rows;
      t.value = obj[key] || '';
      t.oninput = function () { obj[key] = t.value; changed(); };
      w.appendChild(t);
    }
    else if (type === 'color') {
      w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
      var box = h('div', 'colors'), pick = h('input'); pick.type = 'color';
      function paint() {
        Array.prototype.forEach.call(box.querySelectorAll('i'), function (s) { s.classList.toggle('on', s.dataset.c.toLowerCase() === String(obj[key]).toLowerCase()); });
        pick.value = /^#[0-9a-f]{6}$/i.test(obj[key]) ? obj[key] : '#ff9ccf';
      }
      PALETTE.forEach(function (c) {
        var s = h('i'); s.style.background = c; s.dataset.c = c;
        s.onclick = function () { obj[key] = c; paint(); changed(); };
        box.appendChild(s);
      });
      pick.oninput = function () { obj[key] = pick.value; paint(); changed(); };
      box.appendChild(pick); w.appendChild(box); paint();
    }
    else if (type === 'select') {
      w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
      var s = h('select', 'in');
      spec.options.forEach(function (o) { var op = h('option'); op.value = o.v; op.textContent = o.l; s.appendChild(op); });
      s.value = obj[key];
      s.onchange = function () { obj[key] = spec.num ? Number(s.value) : s.value; if (spec.rebuild && spec.rebuild.call) spec.rebuild(); changed(); };
      w.appendChild(s);
    }
    else if (type === 'switch') {
      var l = h('label', 'sw', '<span>' + E(spec.label) + '</span>'), c = h('input'); c.type = 'checkbox'; c.checked = !!obj[key];
      c.onchange = function () { obj[key] = c.checked; changed(); };
      l.appendChild(c); w.appendChild(l);
    }
    else if (type === 'range') {
      w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
      var r = h('div', 'rng'), inp = h('input'), b = h('b');
      inp.type = 'range'; inp.min = spec.min; inp.max = spec.max; inp.step = spec.step || 1; inp.value = obj[key]; b.textContent = obj[key];
      inp.oninput = function () { obj[key] = Number(inp.value); b.textContent = inp.value; changed(); };
      r.appendChild(inp); r.appendChild(b); w.appendChild(r);
    }
    else if (type === 'flags') {
      w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
      spec.flags.forEach(function (f) {
        var l = h('label', 'sw', '<span>' + E(f.label) + '</span>'), c = h('input'); c.type = 'checkbox'; c.checked = !!obj[key][f.key];
        c.onchange = function () { obj[key][f.key] = c.checked ? 1 : 0; changed(); };
        l.appendChild(c); w.appendChild(l);
      });
    }
    else if (type === 'list') {
      (function build() {
        w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
        obj[key].forEach(function (v, n) {
          var row = h('div', 'item'), i = h('input', 'in'); i.maxLength = spec.itemMax || 70; i.value = v;
          i.oninput = function () { obj[key][n] = i.value; changed(); };
          var x = h('button', 'x', '✕'); x.type = 'button'; x.onclick = function () { obj[key].splice(n, 1); build(); changed(); };
          row.appendChild(i); if (!spec.fixed) row.appendChild(x); w.appendChild(row);
        });
        if (!spec.fixed && obj[key].length < (spec.max || 20)) {
          var a = h('button', 'btn ghost sm', '＋ ' + E(spec.addLabel || 'Agregar')); a.type = 'button';
          a.onclick = function () { obj[key].push(''); build(); changed(); var ins = w.querySelectorAll('.item .in'); if (ins.length) ins[ins.length - 1].focus(); };
          w.appendChild(a);
        }
      })();
    }
    else if (type === 'cards') {
      (function build() {
        w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
        obj[key].forEach(function (it, n) {
          var card = h('div', 'mini'), hd = h('div', 'mh', '<b>' + E(spec.itemLabel || 'Item') + ' ' + (n + 1) + '</b>');
          var ctr = h('span');
          [['▲', -1], ['▼', 1]].forEach(function (d) {
            var m = h('button', 'x', d[0]); m.type = 'button';
            m.onclick = function () { var j = n + d[1]; if (j < 0 || j >= obj[key].length) return; var tmp = obj[key][n]; obj[key][n] = obj[key][j]; obj[key][j] = tmp; build(); changed(); };
            ctr.appendChild(m);
          });
          if (obj[key].length > (spec.min || 0)) {
            var x = h('button', 'x', '✕'); x.type = 'button'; x.onclick = function () { obj[key].splice(n, 1); build(); changed(); }; ctr.appendChild(x);
          }
          hd.appendChild(ctr); card.appendChild(hd);
          spec.of.forEach(function (sf) {
            if (sf.showIf && sf.showIf.in.indexOf(it[sf.showIf.key]) < 0) return;
            var sp = sf;
            if (sf.type === 'select' && sf.rebuild) { sp = Object.assign({}, sf, { rebuild: build }); }
            card.appendChild(field(sp, it, sf.key));
          });
          w.appendChild(card);
        });
        if (obj[key].length < (spec.max || 12)) {
          var a = h('button', 'btn ghost sm', '＋ ' + E(spec.addLabel || 'Agregar')); a.type = 'button';
          a.onclick = function () { var b = spec.def_item ? clone(spec.def_item) : {}; if (!spec.def_item) spec.of.forEach(function (sf) { b[sf.key] = sf.type === 'list' ? [] : ''; }); obj[key].push(b); build(); changed(); };
          w.appendChild(a);
        }
      })();
    }
    else if (type === 'photos') {
      (function build() {
        w.innerHTML = '<label class="l">' + E(spec.label) + ' <span class="muted">(' + obj[key].length + '/' + spec.max + ')</span></label>';
        var g = h('div', 'thumbs');
        obj[key].forEach(function (src, n) {
          var t = h('div', 'thumb'), im = h('img'); im.src = src; im.alt = '';
          var x = h('button', 'x', '✕'); x.type = 'button'; x.onclick = function () { obj[key].splice(n, 1); build(); changed(); };
          t.appendChild(im); t.appendChild(x); g.appendChild(t);
        });
        if (obj[key].length) w.appendChild(g);
        if (obj[key].length < spec.max) {
          var a = h('button', 'btn ghost sm', '📷 ' + E(spec.addLabel || 'Subir fotos')); a.type = 'button';
          a.onclick = function () {
            pickFiles(true).then(function (files) {
              var room = spec.max - obj[key].length; files = files.slice(0, room);
              if (!files.length) return;
              a.disabled = true; a.textContent = 'Procesando…';
              return Promise.all(files.map(function (f) { return photo(f).catch(function () { return null; }); })).then(function (r) {
                var okf = r.filter(Boolean); if (okf.length < r.length) LE.toast('Alguna foto no se pudo leer', true);
                okf.forEach(function (d) { obj[key].push(d); }); build(); changed();
              });
            });
          };
          w.appendChild(a);
        }
      })();
    }
    else if (type === 'photo') {
      (function build() {
        w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
        var pc = h('div', 'pc'), pic = h('div', 'pic', obj[key] ? '' : '📷');
        if (obj[key]) pic.style.backgroundImage = 'url(' + obj[key] + ')';
        pic.onclick = function () {
          pickFiles(false).then(function (f) { if (!f[0]) return; return photo(f[0]).then(function (d) { obj[key] = d; build(); changed(); }, function () { LE.toast('No se pudo leer esa foto', true); }); });
        };
        pc.appendChild(pic);
        var info = h('span', 'muted', obj[key] ? 'Toca la foto para cambiarla' : 'Toca el cuadro para subir una foto (opcional)');
        info.style.flex = '1'; pc.appendChild(info);
        if (obj[key]) { var x = h('button', 'x', '✕'); x.type = 'button'; x.onclick = function () { obj[key] = ''; build(); changed(); }; pc.appendChild(x); }
        w.appendChild(pc);
      })();
    }
    else if (type === 'audio') {
      (function build() {
        var nameKey = spec.nameKey;
        w.innerHTML = '<label class="l">' + E(spec.label) + '</label>';
        if (obj[key]) {
          var row = h('div', 'item'), nm = h('input', 'in'); nm.readOnly = true; nm.value = '🎵 ' + ((nameKey && obj[nameKey]) || 'cancion.mp3');
          var x = h('button', 'x', '✕'); x.type = 'button';
          x.onclick = function () { obj[key] = ''; if (nameKey) obj[nameKey] = ''; build(); changed(); };
          row.appendChild(nm); row.appendChild(x); w.appendChild(row);
        } else {
          var a = h('button', 'btn ghost sm', '🎵 Elegir canción (MP3)'); a.type = 'button';
          a.onclick = function () {
            pickFiles(false, 'audio/mpeg,audio/mp3,audio/mp4,audio/aac,audio/ogg,audio/wav,.mp3,.m4a').then(function (f) {
              var file = f[0]; if (!file) return;
              if (file.size > AUDIO_IN_MAX) { LE.toast('Ese archivo pesa ' + (file.size / 1048576).toFixed(0) + ' MB. Elige uno de menos de 30 MB.', true); return; }
              a.disabled = true;
              function toData(blobOrFile, nm) {
                var r = new FileReader();
                r.onerror = function () { LE.toast('No se pudo leer esa canción', true); build(); };
                r.onload = function () {
                  var d = String(r.result || '');
                  if (!/^data:audio\//.test(d)) d = d.replace(/^data:[^;]*;/, 'data:audio/mpeg;');
                  if (d.length > 2850 * 1024) { LE.toast('La canción sigue pesando demasiado. Prueba con una más corta.', true); build(); return; }
                  obj[key] = d; if (nameKey) obj[nameKey] = nm.slice(0, 60); build(); changed();
                };
                r.readAsDataURL(blobOrFile);
              }
              if (file.size <= AUDIO_TARGET) { a.textContent = 'Cargando…'; toData(file, file.name); return; }
              a.textContent = 'Comprimiendo… 0%';
              compressAudio(file, function (pct) { a.textContent = 'Comprimiendo… ' + pct + '%'; }).then(function (blob) {
                toData(blob, file.name.replace(/\.[^.]+$/, '') + '.mp3');
              }).catch(function (e) {
                var m = String(e && e.message || '');
                if (m.indexOf('long:') === 0) LE.toast('Esa canción dura demasiado (máximo ~' + m.slice(5) + ' min). Recórtala o elige otra.', true);
                else LE.toast('No se pudo comprimir esa canción. Prueba con otro MP3 o revisa tu internet.', true);
                build();
              });
            });
          };
          w.appendChild(a);
          w.appendChild(h('p', 'muted', 'Opcional · canciones de hasta ~8 min (se comprimen solas). Suena al tocar la pantalla.'));
        }
      })();
    }
    else if (type === 'photocards') {
      (function build() {
        w.innerHTML = '<label class="l">' + E(spec.label) + ' <span class="muted">(' + obj[key].length + '/' + spec.max + ')</span></label>';
        obj[key].forEach(function (it, n) {
          var card = h('div', 'mini'), pc = h('div', 'pc'), pic = h('div', 'pic', it.src ? '' : '📷');
          if (it.src) pic.style.backgroundImage = 'url(' + it.src + ')';
          pic.onclick = function () {
            pickFiles(false).then(function (f) { if (!f[0]) return; return photo(f[0]).then(function (d) { it.src = d; build(); changed(); }, function () { LE.toast('No se pudo leer esa foto', true); }); });
          };
          var cap = h('input', 'in'); cap.maxLength = 60; cap.placeholder = 'Descripción (opcional)'; cap.value = it.cap || '';
          cap.oninput = function () { it.cap = cap.value; changed(); };
          var x = h('button', 'x', '✕'); x.type = 'button'; x.onclick = function () { obj[key].splice(n, 1); build(); changed(); };
          pc.appendChild(pic); pc.appendChild(cap); pc.appendChild(x); card.appendChild(pc); w.appendChild(card);
        });
        if (obj[key].length < spec.max) {
          var a = h('button', 'btn ghost sm', '📷 ' + E(spec.addLabel || 'Agregar foto')); a.type = 'button';
          a.onclick = function () { obj[key].push({ src: '', cap: '' }); build(); changed(); };
          w.appendChild(a);
        }
      })();
    }
    return w;
  }

  function buildForm() {
    var f = $('form'); f.innerHTML = '';
    tpl.groups.forEach(function (g, gi) {
      var d = h('details', 'grp'); if (gi === 0) d.open = true;
      d.appendChild(h('summary', '', E(g.title)));
      var body = h('div', 'body');
      g.fields.forEach(function (sp) { body.appendChild(field(sp, cfg, sp.key)); });
      d.appendChild(body); f.appendChild(d);
    });
  }

  /* ======================= vista previa ======================= */
  function getHtml(slug) {
    if (HTML[slug]) return Promise.resolve(HTML[slug]);
    return fetch('/api/template?slug=' + encodeURIComponent(slug)).then(function (r) {
      if (!r.ok) throw new Error('No se pudo cargar el diseño.'); return r.text();
    }).then(function (t) { HTML[slug] = t; return t; });
  }
  function previewVisible() { return desktop() || (tab === 'prev'); }
  function frameFor(target) {
    return getHtml(tpl.slug).then(function (html) {
      var f = document.createElement('iframe');
      f.setAttribute('allow', 'autoplay; fullscreen');
      f.srcdoc = LE_RENDER.render(html, tpl.kind, cfg);
      target.innerHTML = ''; target.appendChild(f);
    });
  }
  function buildPreview() {
    if (!tpl) return;
    dirty = false;
    frameFor($('phone')).catch(function (e) { $('phone').innerHTML = '<div class="ph">' + E(e.message) + '</div>'; });
  }
  function schedulePreview() {
    clearTimeout(tPrev);
    if (!previewVisible()) return;
    tPrev = setTimeout(buildPreview, 1100);
  }
  function setTab(t) {
    tab = t;
    $('ed').classList.toggle('show-prev', t === 'prev');
    Array.prototype.forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.dataset.t === t); });
    if (t === 'prev') { if (dirty || !$('phone').querySelector('iframe')) buildPreview(); }
    else if (!desktop()) { $('phone').innerHTML = '<div class="ph">La vista previa aparece aquí</div>'; dirty = true; }
    window.scrollTo(0, 0);
  }
  $('tabs').onclick = function (e) { var b = e.target.closest('button'); if (b) setTab(b.dataset.t); };
  addEventListener('resize', function () { if (desktop()) { $('ed').classList.remove('show-prev'); if (dirty) schedulePreview(); } });

  function fullscreen(src) {
    var o = h('div', 'fs'), b = h('button', '', '✕'); b.setAttribute('aria-label', 'Cerrar');
    b.onclick = function () { o.remove(); };
    o.appendChild(b); document.body.appendChild(o);
    var holder = document.createElement('div'); holder.style.cssText = 'position:absolute;inset:0';
    o.appendChild(holder);
    if (src) { var f = document.createElement('iframe'); f.src = src; holder.appendChild(f); }
    else frameFor(holder);
  }
  $('bFull').onclick = function () { fullscreen(null); };

  /* ======================= borrador ======================= */
  function scheduleDraft() {
    if (editId) return;
    clearTimeout(tDraft);
    tDraft = setTimeout(saveDraft, 800);
  }
  function saveDraft() { try { if (tpl && !editId) localStorage.setItem('le_draft', JSON.stringify({ slug: tpl.slug, config: cfg })); } catch (e) { } }
  function loadDraft() { try { return JSON.parse(localStorage.getItem('le_draft') || 'null'); } catch (e) { return null; } }

  /* ======================= pasos ======================= */
  function showPick() {
    tpl = null; editId = null;
    $('stepEdit').classList.add('hidden'); $('bar').classList.add('hidden'); $('stepPick').classList.remove('hidden');
    var g = $('grid'); g.innerHTML = '';
    TPLS.forEach(function (t) {
      var w = h('div', 'tpw');
      var b = h('button', 'tp', '<span class="lt" data-thumb="' + t.slug + '" data-emoji="' + E(t.emoji || '') + '"></span><b>' + E(t.name) + '</b><small>' + E(t.desc) + '</small>' +
        '<span class="tags"><span class="chip">' + E(t.tag) + '</span><span class="chip">' + E(t.dim) + '</span><span class="chip ok">' + LE.price(t.price).usd + '</span></span>');
      b.type = 'button'; b.onclick = function () { openEditor(t.slug); };
      var d = h('button', 'demo', '▶ Demo'); d.type = 'button'; d.onclick = function () { fullscreen('previews/' + t.slug + '.html'); };
      w.appendChild(b); w.appendChild(d); g.appendChild(w);
    });
    if (window.LEThumbs) LEThumbs.scan(g);
    history.replaceState(null, '', 'crear.html'); window.scrollTo(0, 0);
  }

  function openEditor(slug, config, existingId) {
    tpl = TPLS.filter(function (t) { return t.slug === slug; })[0];
    if (!tpl) return showPick();
    cfg = clone(tpl.defaults);
    if (config) Object.keys(config).forEach(function (k) { if (k in cfg) cfg[k] = config[k]; });
    editId = existingId || null; dirty = true; tab = 'edit';
    $('stepPick').classList.add('hidden'); $('stepEdit').classList.remove('hidden'); $('bar').classList.remove('hidden');
    $('ed').classList.remove('show-prev'); setTab('edit');
    $('edTitle').innerHTML = (editId ? 'Edita tu <em>página</em>' : tpl.emoji + ' ' + E(tpl.name));
    $('edSub').innerHTML = editId
      ? 'Los cambios se guardan en el mismo enlace.'
      : 'Completa tus datos y mira cómo queda. Es gratis por ' + (LE.cfg.FREE_HOURS || 16) + ' horas; para dejarla para siempre cuesta <b>' +
        LE.price(tpl.price).usd + ' · ' + LE.price(tpl.price).bob + '</b>, el mismo precio del catálogo.';
    $('bCreate').textContent = editId ? '💾 Guardar cambios' : '✨ Crear mi página';
    $('bBack').textContent = editId ? '← Volver' : '← Diseños';
    buildForm();
    if (!editId) history.replaceState(null, '', 'crear.html?t=' + slug);
    window.scrollTo(0, 0);
    if (desktop()) buildPreview();
  }

  $('bBack').onclick = function () {
    if (editId) location.href = 'listo.html?id=' + editId; else showPick();
  };

  $('bCreate').onclick = function () {
    var b = $('bCreate'), txt = b.textContent;
    b.disabled = true; b.textContent = editId ? 'Guardando…' : 'Creando…';
    var req = editId
      ? LE.api('/api/page?id=' + editId, { method: 'PUT', body: { config: cfg }, editKey: LE.editKey(editId) }).then(function () { return { id: editId }; })
      : LE.api('/api/create', { method: 'POST', body: { slug: tpl.slug, config: cfg } }).then(function (d) { LE.remember(d.id, d.edit_key); return d; });
    req.then(function (d) {
      try { localStorage.removeItem('le_draft'); } catch (e) { }
      location.href = 'listo.html?id=' + d.id;
    }).catch(function (e) {
      if (e.data && e.data.needLogin) {
        saveDraft();
        location.href = 'login.html?reason=limit&next=' + encodeURIComponent('crear.html?resume=1');
        return;
      }
      LE.toast(e.message || 'No se pudo crear. Prueba de nuevo.', true);
      b.disabled = false; b.textContent = txt;
    });
  };

  /* ======================= cupo de paginas gratis ======================= */
  /* cronometro hasta que se recarga una pagina gratis */
  function cdText(iso) {
    var ms = Math.max(0, new Date(iso) - Date.now()), t = Math.floor(ms / 1000);
    var d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), sc = t % 60;
    var z = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d ? d + ' d ' : '') + z(h) + ':' + z(m) + ':' + z(sc);
  }
  function cd(iso) { return '<span class="cdq" data-t="' + iso + '">' + cdText(iso) + '</span>'; }
  var cdTimer = null;
  function startCd() {
    if (cdTimer) clearInterval(cdTimer);
    cdTimer = setInterval(function () {
      var els = document.querySelectorAll('.cdq[data-t]'), done = false;
      if (!els.length) { clearInterval(cdTimer); cdTimer = null; return; }
      [].forEach.call(els, function (el) {
        if (new Date(el.dataset.t) - Date.now() <= 0) done = true; else el.textContent = cdText(el.dataset.t);
      });
      if (done) { clearInterval(cdTimer); cdTimer = null; showQuota(); }
    }, 1000);
  }
  function showQuota() {
    var b = $('qbanner');
    if (qs.get('edit')) { b.innerHTML = ''; return; }
    LE.quota().then(function (q) {
      if (q.admin) { b.innerHTML = ''; return; }
      var login = '<button class="btn sm" id="qLogin" type="button">Iniciar sesión</button>', h;
      var cada = q.windowDays === 1 ? 'cada día' : 'cada ' + q.windowDays + ' días';
      var ud = q.userWindowDays || q.windowDays;
      var cadaCuenta = ud === 1 ? 'cada día' : 'cada ' + ud + ' días';
      var ul = q.userLimit || 1;
      var pagsCuenta = ul === 1 ? 'una página más' : ul + ' páginas gratis';
      var pagsPrueba = q.limit === 1 ? 'página de prueba' : 'páginas de prueba';
      if (!q.loggedIn) {
        h = q.remaining > 0
          ? '<div class="banner">🎁 Sin cuenta puedes crear <b>' + q.limit + ' ' + pagsPrueba + '</b>. Con una cuenta gratis tienes ' + pagsCuenta + ' ' + cadaCuenta + '.<div class="r2">' + login + '</div></div>'
          : '<div class="banner bad">Ya usaste tu página de prueba. <b>Inicia sesión</b> y tienes ' + pagsCuenta + ' ' + cadaCuenta + '.<div class="r2">' + login + '</div></div>';
      } else {
        h = q.remaining > 0
          ? '<div class="banner">👤 Sesión iniciada. Tienes <b>' + q.remaining + (q.remaining === 1 ? ' página gratis</b> disponible' : ' páginas gratis</b> disponibles') + ' (' + q.limit + ' ' + cada + ').' + (q.resetAt ? '<br>⏳ Se te recarga <b>1 página</b> en ' + cd(q.resetAt) : '') + '</div>'
          : '<div class="banner bad">Ya usaste ' + (q.limit === 1 ? 'tu página gratis' : 'tus páginas gratis') + '. Puedes crear otra en ' + (q.resetAt ? cd(q.resetAt) : '<b>unos días</b>') + '. Mientras tanto, puedes hacer permanente alguna de las tuyas.</div>';
      }
      b.innerHTML = h; startCd();
      var ql = $('qLogin');
      if (ql) ql.onclick = function () { saveDraft(); location.href = 'login.html?next=' + encodeURIComponent('crear.html?resume=1'); };
    }).catch(function () { });
  }

  /* ======================= arranque ======================= */
  showQuota();
  fetch('templates.json').then(function (r) { return r.json(); }).then(function (d) {
    TPLS = d.templates;
    var editParam = qs.get('edit');
    if (editParam) {
      return LE.api('/api/page?id=' + encodeURIComponent(editParam), { editKey: LE.editKey(editParam) }).then(function (p) {
        openEditor(p.plantilla, p.config, editParam);
      }, function (e) {
        LE.toast(e.status === 403 ? 'Inicia sesión con la cuenta que la creó para editarla.' : e.message, true);
        setTimeout(function () { location.href = e.status === 403 ? 'login.html?next=' + encodeURIComponent('crear.html?edit=' + editParam) : 'crear.html'; }, 1600);
      });
    }
    var dr = qs.get('resume') ? loadDraft() : null;
    if (dr && TPLS.some(function (t) { return t.slug === dr.slug; })) return openEditor(dr.slug, dr.config);
    var t = qs.get('t');
    if (t && TPLS.some(function (x) { return x.slug === t; })) return openEditor(t);
    showPick();
  }).catch(function () { $('grid').innerHTML = '<div class="alert bad">No se pudieron cargar los diseños. Recarga la página.</div>'; });
})();
</script>
<script src="brand-icons.js"></script>
</body>
</html>
