
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Emocional | Regalos Digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root {
    --pink: #8b6ff0;
    --pink-soft: #b9a6ff;
    --wine: #241a4a;
    --wine-soft: #6f5bc0;
    --blue: #2a8fae;
    --blue-light: #6fd6e8;
    --blue-deep: #1c1440;
    --navy: #0d0a1e;
    --navy-2: #050308;
    --ink: #f2f0fb;
    --muted: #a8a0c4;
    --muted-2: #756e94;
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.09);
    --grad-brand: linear-gradient(120deg, var(--blue-light) 0%, var(--pink) 55%, var(--wine-soft) 100%);
    --border-soft: rgba(139,111,240,0.22);
    --border-soft-blue: rgba(134,215,232,0.22);
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 12% -8%, rgba(139,111,240,0.20), transparent 42%),
        radial-gradient(circle at 92% 8%, rgba(134,215,232,0.16), transparent 40%),
        radial-gradient(circle at 50% 115%, rgba(58,42,112,0.30), transparent 55%),
        linear-gradient(165deg, var(--navy-2) 0%, var(--navy) 45%, #0c0818 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Quicksand', 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
}
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.view { position: relative; z-index: 1; min-height: 100vh; }

/* ===== VISTA: PORTADA ===== */
.wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 24px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}
.avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: linear-gradient(150deg, var(--pink) 0%, var(--wine) 55%, var(--blue-deep) 100%);
    padding: 3px;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 10px 45px rgba(139,111,240,0.35), 0 0 60px rgba(58,150,180,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    margin-bottom: 24px;
}
.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    background: var(--navy-2);
}
h1 {
    font-size: 22px; font-weight: 800; margin: 0 0 8px; letter-spacing: 0.01em;
    background-image: var(--grad-brand);
    background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: brandShift 6s ease-in-out infinite;
}
.subtitle { font-size: 13.5px; color: var(--muted); margin: 0 0 26px; line-height: 1.55; max-width: 340px; }
.socials { display: flex; gap: 14px; margin-bottom: 32px; }
.socials a {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--glass);
    border: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; text-decoration: none; color: var(--ink);
    transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.socials a svg { display: block; }
.socials a:hover {
    transform: translateY(-3px) scale(1.06);
    background: rgba(139,111,240,0.14);
    border-color: rgba(139,111,240,0.5);
    box-shadow: 0 8px 20px rgba(139,111,240,0.25);
    color: var(--pink-soft);
}
.pill {
    width: 100%; display: block; text-decoration: none; color: var(--ink);
    position: relative;
    background: var(--glass);
    border: 1px solid var(--border-soft-blue);
    border-radius: 20px; padding: 18px 24px; margin-bottom: 14px;
    font-weight: 700; font-size: 14.5px; line-height: 1.4; cursor: pointer;
    transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    backdrop-filter: blur(6px);
}
.pill span { display: block; font-weight: 600; font-size: 12px; color: var(--muted); margin-top: 4px; }
.pill:hover { transform: translateY(-3px); }
.pill.main {
    background: linear-gradient(135deg, rgba(139,111,240,0.22), rgba(58,150,180,0.16));
    border-color: rgba(139,111,240,0.55);
}
.pill.main:hover { box-shadow: 0 12px 30px rgba(139,111,240,0.28); border-color: rgba(139,111,240,0.8); }
.pill.free {
    background: linear-gradient(135deg, rgba(58,42,112,0.24), rgba(58,42,112,0.06));
    border-color: rgba(167,140,245,0.5);
}
.pill.free:hover { box-shadow: 0 12px 30px rgba(58,42,112,0.3); border-color: rgba(167,140,245,0.8); }
.footer { margin-top: auto; padding-top: 40px; font-size: 11px; color: var(--muted-2); letter-spacing: 0.02em; }

/* ===== VISTA: CATALOGO ===== */
.topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px;
    background: rgba(12,4,20,0.82); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
}
.topbar button.back {
    color: var(--ink); background: none; border: none; text-decoration: none;
    font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px;
    cursor: pointer; font-family: inherit; padding: 6px 4px;
    transition: color .15s ease;
}
.topbar button.back:hover { color: var(--pink-soft); }
.topbar .brand {
    font-weight: 800; font-size: 14.5px; letter-spacing: 0.01em;
    background-image: var(--grad-brand);
    background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: brandShift 6s ease-in-out infinite;
}
.hero { text-align: center; padding: 44px 20px 12px; }
.hero h1 { font-size: 25px; margin: 0 0 8px; }
.hero p { font-size: 13.5px; color: var(--muted); margin: 0; }

@keyframes brandShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* pestañas del catalogo no personalizado: todos / sin editor / gratis */
.cat-tabs {
    max-width: 420px; margin: 24px auto 0; padding: 0 20px;
    display: flex; gap: 8px;
}
.cat-tab {
    flex: 1; text-align: center; cursor: pointer; font-family: inherit;
    font-weight: 700; font-size: 12.5px; padding: 12px 10px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--border-soft-blue);
    color: var(--muted); transition: background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.cat-tab.active {
    background: linear-gradient(135deg, rgba(139,111,240,0.28), rgba(58,150,180,0.22));
    border-color: rgba(139,111,240,0.6); color: var(--ink);
    box-shadow: 0 6px 18px rgba(139,111,240,0.2);
}
.cat-note { max-width: 420px; margin: 14px auto 0; padding: 0 20px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }

.section-heading {
    max-width: 1080px; margin: 40px auto 0; padding: 0 20px 0;
    font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px;
}
.section-heading .pill-count {
    font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--glass);
    border: 1px solid var(--border-soft-blue); padding: 2px 9px; border-radius: 999px;
}
.section-heading.gratis { color: var(--pink-soft); }

.grid {
    max-width: 1080px; margin: 30px auto 60px; padding: 0 20px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px;
}
.card {
    background: linear-gradient(165deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border: 1px solid var(--border-soft-blue);
    border-radius: 20px; overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.card:hover {
    transform: translateY(-5px);
    border-color: rgba(139,111,240,0.45);
    box-shadow: 0 16px 34px rgba(20,4,35,0.45), 0 0 0 1px rgba(139,111,240,0.08);
}
.card-thumb { height: 180px; position: relative; background: #05080a; overflow: hidden; }
.card-thumb canvas, .card-thumb .thumb2d { display: block; width: 100%; height: 100%; }
.card-thumb .thumb2d { position: relative; }

/* contenedor de badges de la esquina superior izquierda (categoria + dimension) */
.thumb-badges-left {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
}
.card-thumb .tag {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    background: rgba(0,0,0,0.45); padding: 4px 9px; border-radius: 999px;
}
.card-thumb .badge-3d {
    font-size: 10px; font-weight: 800; letter-spacing: 0.03em;
    background: rgba(134,215,232,0.22); border: 1px solid rgba(134,215,232,0.5); color: #9fe3ef;
    padding: 3px 8px 3px 7px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px;
}

/* badge "con editor" / "tambien personalizable": boton con tooltip de beneficios */
.card-thumb .editor-badge {
    position: absolute; top: 10px; right: 10px; z-index: 3;
    font-size: 10px; font-weight: 700; font-family: inherit;
    background: rgba(139,111,240,0.22); border: 1px solid rgba(139,111,240,0.5); color: var(--pink-soft);
    padding: 4px 8px; border-radius: 999px; display: flex; align-items: center; gap: 4px;
    cursor: pointer; transition: background .15s ease;
}
.card-thumb .editor-badge:hover { background: rgba(139,111,240,0.34); }
.card-thumb .editor-badge.also-badge {
    background: rgba(134,215,232,0.2); border-color: rgba(134,215,232,0.5); color: #9fe3ef;
}
.card-thumb .editor-badge.also-badge:hover { background: rgba(134,215,232,0.32); }

/* tooltip flotante UNICO y compartido, fuera de la miniatura (que tiene overflow:hidden) */
#sharedTooltip {
    position: fixed; width: 210px; max-height: 190px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: rgba(15,5,24,0.97); border: 1px solid rgba(139,111,240,0.35);
    border-radius: 12px; padding: 10px 12px; text-align: left;
    box-shadow: 0 14px 34px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 999;
}
#sharedTooltip.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
#sharedTooltip .tooltip-title {
    display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--pink-soft); margin-bottom: 6px; font-weight: 800;
    position: sticky; top: 0; background: inherit; padding-bottom: 2px;
}
#sharedTooltip .tooltip-price {
    display: block; font-size: 11.5px; font-weight: 800; color: #9fe3ef; margin-bottom: 8px;
}
#sharedTooltip ul { margin: 0; padding-left: 16px; }
#sharedTooltip li { font-size: 11px; font-weight: 600; color: var(--ink); line-height: 1.5; margin-bottom: 4px; }
#sharedTooltip li:last-child { margin-bottom: 0; }
#sharedTooltip::-webkit-scrollbar { width: 5px; }
#sharedTooltip::-webkit-scrollbar-thumb { background: rgba(139,111,240,0.45); border-radius: 3px; }

.card-body { padding: 17px 18px 19px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-body h3 { margin: 0; font-size: 15.5px; font-weight: 800; }
.card-body p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; flex: 1; }
.price { font-size: 13.5px; font-weight: 800; background-image: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.price.gratis { background-image: none; color: var(--pink-soft); }
.card-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn {
    flex: 1; text-align: center; text-decoration: none; font-weight: 700; font-size: 12px;
    padding: 11px 8px; border-radius: 11px; border: 1px solid var(--border-soft-blue);
    color: var(--ink); background: var(--glass); transition: background .15s ease, border-color .15s ease;
    font-family: inherit; cursor: pointer;
}
.btn:hover { background: var(--glass-strong); border-color: rgba(139,111,240,0.4); }
.btn.whatsapp { background: rgba(38,224,102,0.14); border-color: rgba(38,224,102,0.4); color: #7cffb0; display: flex; align-items: center; justify-content: center; gap: 5px; }
.btn.whatsapp:hover { background: rgba(38,224,102,0.24); }
.note { max-width: 1080px; margin: 0 auto 40px; padding: 0 20px; font-size: 12px; color: var(--muted-2); text-align: center; }

/* miniatura 2D generica (SVG) */
.flores2d-svg { width: 100%; height: 100%; display: block; }

/* mini splash overlay (solo para Flores Amarillas 3D), replica la pantalla de bienvenida del producto real */
.mini-intro-overlay {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 10px 12px;
    background: radial-gradient(ellipse at center, rgba(40,26,6,0.97) 0%, rgba(6,4,2,0.99) 75%);
    transition: opacity .5s ease, visibility .5s ease;
    cursor: pointer;
}
.mini-intro-overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.mini-intro-badge { color: #ffcf40; font-size: 8px; font-weight: 700; letter-spacing: 0.18em; margin-bottom: 4px; }
.mini-intro-title { font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 11px; color: #fff6e0; text-shadow: 0 0 10px rgba(255,207,64,0.7); margin: 0 0 2px; }
.mini-intro-sub { color: #e8c98a; font-size: 9px; font-style: italic; margin: 0 0 4px; }
.mini-bouquet { margin-bottom: 6px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
.mini-intro-btn {
    background: linear-gradient(135deg,#ffe28a,#ffcf40); color: #3a2604; border: none; border-radius: 999px;
    padding: 6px 14px; font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 9.5px;
    cursor: pointer; box-shadow: 0 4px 12px rgba(255,207,64,.35);
}

/* toast de aviso (ej. video aun no disponible) */
#appToast {
    position: fixed; left: 50%; bottom: 28px; z-index: 1000;
    transform: translateX(-50%) translateY(16px);
    max-width: 90vw; width: 340px;
    background: rgba(15,5,24,0.97); border: 1px solid rgba(139,111,240,0.4);
    border-radius: 14px; padding: 13px 16px; text-align: left;
    box-shadow: 0 14px 34px rgba(0,0,0,0.5);
    display: flex; align-items: center; gap: 10px;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
}
#appToast.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#appToast .toast-icon { font-size: 18px; flex-shrink: 0; }
#appToast .toast-text { font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.45; }
</style>
</head>

var toastTimer = null;
function showToast(message, icon){
    var toast = document.getElementById('appToast');

    var iconEl = toast.querySelector('.toast-icon');
    text.textContent = message;
    iconEl.textContent = icon || '🎬';
    toast.classList.add('open');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('open'); }, 3600);
}

/* estrellas de fondo */
(function(){
    var canvas = document.getElementById("stars");
    var ctx = canvas.getContext("2d");
    var stars = [];
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function build(){
        stars = [];
        var count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
        for (var i = 0; i < count; i++) {
            var angle = Math.random()*Math.PI*2;
            var speed = Math.random()*0.06 + 0.015;
            stars.push({
                x: Math.random()*canvas.width,
                y: Math.random()*canvas.height,
                r: Math.random()*1.4+0.3,
                a: Math.random()*0.6+0.2,
                s: Math.random()*0.015+0.005,
                vx: Math.cos(angle)*speed,
                vy: Math.sin(angle)*speed
            });
        }
    }
    function draw(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(function(st){
            st.a += st.s;
            st.x += st.vx;
            st.y += st.vy;
            if (st.x < -5) st.x = canvas.width + 5;
            if (st.x > canvas.width + 5) st.x = -5;
            if (st.y < -5) st.y = canvas.height + 5;
            if (st.y > canvas.height + 5) st.y = -5;
            var op = 0.35 + 0.35 * Math.sin(st.a);
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(180,255,240," + op + ")";
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    window.addEventListener("resize", function(){ resize(); build(); });
    resize(); build(); draw();
})();

    function openTooltipFor(badge){
        var featuresAttr = badge.getAttribute("data-features") || "";
        var features = featuresAttr.split(";").map(function(s){ return s.trim(); }).filter(Boolean);
        tooltipList.innerHTML = "";
        features.forEach(function(f){
            var li = document.createElement("li");
            li.textContent = f;
            tooltipList.appendChild(li);
        });

        var alsoPrice = badge.getAttribute("data-also-price");
        if (alsoPrice) {
            tooltipPrice.style.display = "block";
            tooltipPrice.textContent = "Versión con editor: " + alsoPrice;
        } else {
            tooltipPrice.style.display = "none";
        }

        tooltip.scrollTop = 0;

        var rect = badge.getBoundingClientRect();
        var tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
        var left = rect.right - tw;
        left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
        var top = rect.bottom + 8;
        if (top + th > window.innerHeight - 8) top = Math.max(8, rect.top - th - 8);

        tooltip.style.left = left + "px";
        tooltip.style.top = top + "px";
        tooltip.classList.add("open");
        currentBadge = badge;
    }

    document.querySelectorAll(".editor-badge").forEach(function(badge){
        badge.addEventListener("click", function(e){
            e.stopPropagation();
            if (currentBadge === badge && tooltip.classList.contains("open")) {
                closeTooltip();
                return;
            }
            openTooltipFor(badge);
        });
    });

    tooltip.addEventListener("click", function(e){ e.stopPropagation(); });
    document.addEventListener("click", closeTooltip);
    window.addEventListener("scroll", closeTooltip, true);
    window.addEventListener("resize", closeTooltip);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script>
(function(){
"use strict";

function startPreview(kind, containerId){
    /* nota: el grid se destruye y se vuelve a crear cada vez que se cambia de pestaña/modo
       (mismos ids, elementos nuevos), asi que siempre arrancamos un loop nuevo.
       los loops viejos se auto-terminan solos al notar que su canvas/contenedor
       ya no esta en el DOM (ver chequeo .isConnected en cada loop). */
    if (kind.indexOf('three-') === 0) {
        if (typeof THREE === "undefined") return;
        startThreePreview(kind.replace('three-',''), containerId);
    } else if (kind === 'flores2d') {
        startFlores2dPreview(containerId);
    } else if (kind === 'cumple2d') {
        startCumple2dPreview(containerId);
    } else if (kind === 'novia2d') {
        startNovia2dPreview(containerId);
    } else if (kind === 'buzon2d') {
        startBuzon2dPreview(containerId);
    } else if (kind === 'capsula2d') {
        startCapsula2dPreview(containerId);
    } else if (kind === 'libro2d') {
        startLibro2dPreview(containerId);
    } else if (kind === 'maquina2d') {
        startMaquina2dPreview(containerId);
    } else if (kind === 'periodico2d') {
        startPeriodico2dPreview(containerId);
    } else if (kind === 'regalo2d') {
        startRegalo2dPreview(containerId);
    }
}

/* ============== miniatura 2D: Flores Amarillas (jardin de girasoles en forma de corazon) ============== */
function heartPoint(t, scale){
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    return { x: x * scale, y: -y * scale };
}

    ground.setAttribute("x2", "266"); ground.setAttribute("y2", "158");
    ground.setAttribute("stroke", "#3A1030"); ground.setAttribute("stroke-opacity", "0.3");
    ground.setAttribute("stroke-width", "1");
    svg.appendChild(ground);

    /* tronco + ramas, mismo estilo curvo que el original */
    var trunk = document.createElementNS(svgNS, "path");
    trunk.setAttribute("d", "M150,158 C142,132 154,116 146,96 C140,82 152,78 148,66");

    var branchR = document.createElementNS(svgNS, "path");
    branchR.setAttribute("d", "M150,98 C168,90 182,82 196,72");

    branchR.setAttribute("stroke-width", "4"); branchR.setAttribute("stroke-linecap", "round");
    svg.appendChild(branchR);

    /* frase inferior, itálica */
    var bottomText = document.createElementNS(svgNS, "text");
    bottomText.setAttribute("x", "26"); bottomText.setAttribute("y", "178");
    bottomText.setAttribute("font-family", "'Cormorant Garamond', serif");

    bottomText.textContent = "Sembré este jardín para pensar en ti.";
    svg.appendChild(bottomText);

    /* corazon de girasoles, igual estructura que el editor real, a menor escala */
    var centerX = 150, centerY = 70;
    var layers = [0.32, 0.5, 0.68, 0.85, 1.0];
    var points = [];
    layers.forEach(function(scaleLayer){
        var steps = 8 + Math.round(scaleLayer * 6);
        for (var i = 0; i < steps; i++){
            var t = (i / steps) * Math.PI * 2;
            var p = heartPoint(t, 6.2 * scaleLayer);
            points.push({
                x: centerX + p.x + (Math.random()-0.5) * 3,
                y: centerY + p.y + (Math.random()-0.5) * 3,
                size: 11 + Math.random() * 4,
                t: t
            });
        }
    });
    points.sort(function(a,b){ return a.t - b.t; });

    var flowers = points.map(function(p){
        var use = document.createElementNS(svgNS, "use");
        use.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#flowerShape2d");
        use.setAttribute("href", "#flowerShape2d");
        use.setAttribute("x", p.x - p.size/2);
        use.setAttribute("y", p.y - p.size/2);

        use.style.opacity = "0";
        use.style.transformBox = "fill-box";
        use.style.transformOrigin = "center";
        svg.appendChild(use);
        return use;
    });

    var LOOP = 7.5, REVEAL_START = 0.5, STEP_GAP = 0.1, TEXT_IN = 6.0, HOLD_UNTIL = 6.6, FADE_OUT_DUR = 0.7;
    var start = performance.now();

    function tick(){
        if (!container.isConnected) return; /* la tarjeta ya no existe: cortamos el loop */
        requestAnimationFrame(tick);
        var t = (performance.now() - start) / 1000;
        var lt = t % LOOP;

        flowers.forEach(function(f, i){
            var apparition = REVEAL_START + i * STEP_GAP;
            if (lt < apparition){
                f.style.opacity = "0";
                f.style.transform = "scale(0)";
            } else if (lt < HOLD_UNTIL) {
                var localT = Math.min(1, (lt - apparition) / 0.6);
                f.style.opacity = String(localT);
                f.style.transform = "scale(" + (0.3 + 0.7*localT) + ")";
            } else {
                var fadeT = Math.min(1, (lt - HOLD_UNTIL) / FADE_OUT_DUR);
                f.style.opacity = String(Math.max(0, 1 - fadeT));
                f.style.transform = "scale(1)";
            }
        });

        var textT = clamp01((lt - TEXT_IN) / 0.6);
        var textFade = lt < HOLD_UNTIL ? textT : Math.max(0, 1 - (lt - HOLD_UNTIL) / FADE_OUT_DUR);
        bottomText.setAttribute("opacity", String(0.8 * textFade));
    }
    tick();
}

        var cardT = clamp01((lt-CARD_START)/CARD_DUR);
        var cardEase = easeOutCubic(cardT);
        var fadeMul = lt>HOLD_UNTIL ? Math.max(0,1-(lt-HOLD_UNTIL)/(LOOP-HOLD_UNTIL)) : 1;
        var floatY = 104 - cardEase*46 - Math.sin(t*2.2)*2;
        card.setAttribute("transform","translate(150,"+floatY.toFixed(1)+") scale("+(cardEase*fadeMul).toFixed(3)+")");

        glow.setAttribute("r", (58 + 6*Math.sin(t*1.4)).toFixed(1));
    }
    tick();
}

/* ============== previews 3D (Three.js) ============== */
function makeDustTexture(size){
    size = size || 128;
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var ctx = c.getContext("2d"),
        g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.35, "rgba(255,255,255,0.8)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
}
var dustTex = null;

function makeTextTexture(text, shadowColor){
    var c = document.createElement("canvas");
    c.width = 256; c.height = 72;
    var ctx = c.getContext("2d");
    ctx.font = "800 30px Quicksand, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = 16;
    ctx.fillText(text, c.width/2, c.height/2);
    return new THREE.CanvasTexture(c);
}

function makeOrbitWords(words, hues, radius, heightOffset, scaleW, scaleH){
    var group = new THREE.Group();
    var sprites = [];
    words.forEach(function(w, i){
        var tex = makeTextTexture(w, hues[i % hues.length]);
        var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 });
        var spr = new THREE.Sprite(mat);
        spr.scale.set(scaleW, scaleH, 1);
        spr.userData.baseTheta = (i / words.length) * Math.PI * 2;
        spr.userData.phi = Math.PI/2 + (Math.random()-0.5)*0.9;
        spr.userData.pulsePhase = Math.random()*Math.PI*2;
        group.add(spr);
        sprites.push(spr);
    });
    return {
        group: group,
        update: function(t, fadeAmount){
            sprites.forEach(function(spr){
                var theta = spr.userData.baseTheta + t*0.35;
                var phi = spr.userData.phi;
                spr.position.set(
                    radius*Math.sin(phi)*Math.cos(theta),
                    heightOffset + radius*Math.cos(phi)*0.5,
                    radius*Math.sin(phi)*Math.sin(theta)
                );
                var pulse = 0.75 + 0.25*(0.5+0.5*Math.sin(2*t + spr.userData.pulsePhase));
                spr.material.opacity = fadeAmount * pulse;
            });
        }
    };
}

function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function clamp01(v){ return Math.max(0, Math.min(1, v)); }

function makeMiniPreview(canvasId, setup){
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;
    if (!dustTex) dustTex = makeDustTexture();
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 3000);

    function resize(){
        var w = canvas.clientWidth || canvas.parentElement.clientWidth;
        var h = canvas.clientHeight || canvas.parentElement.clientHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }

    var ctx = setup(scene, camera, THREE, dustTex);
    resize();
    window.addEventListener("resize", resize);

    var start = performance.now();
    function loopTick(){
        if (!canvas.isConnected) { renderer.dispose(); return; }
        requestAnimationFrame(loopTick);
        var t = (performance.now() - start) / 1000;
        ctx.update(t);
        renderer.render(scene, camera);
    }
    loopTick();
}

/* ============== CORAZÓN DE PARTÍCULAS: corazón cian armándose en loop ============== */
makeMiniPreview(canvasId, function(scene, camera, THREE, dustTex){

    var target = new Float32Array(N*3), scatter = new Float32Array(N*3), current = new Float32Array(N*3), colors = new Float32Array(N*3);

        target[3*i]=hx; target[3*i+1]=hy; target[3*i+2]=hz;

        scatter[3*i+1] = -60 + Math.random()*30;
        scatter[3*i+2] = Math.sin(ang)*rad;
        var mix = Math.random()<0.4 ? colA : (Math.random()<0.7 ? colB : colC);

    }
    current.set(scatter);

    geo.setAttribute("color", new THREE.BufferAttribute(colors,3));

    function poolTex(){
        var size=512, c=document.createElement("canvas");
        c.width=c.height=size;
        var ctx=c.getContext("2d");

        ctx.fillStyle=g; ctx.fillRect(0,0,size,size);
        return new THREE.CanvasTexture(c);
    }
    var pool = new THREE.Sprite(new THREE.SpriteMaterial({ map: poolTex(), transparent:true, depthWrite:false, blending: THREE.AdditiveBlending, opacity:0 }));

            for (var i=0;i<N*3;i++) current[i] = scatter[i] + (target[i]-scatter[i])*e;
            geo.attributes.position.needsUpdate = true;
            var fadeMul = 1;
            if (lt > HOLD_UNTIL) fadeMul = Math.max(0, 1 - (lt-HOLD_UNTIL)/(LOOP-HOLD_UNTIL));

        }
    };
});

makeMiniPreview(canvasId, function(scene, camera, THREE, dustTex){
    scene.background = new THREE.Color(0x03040c);

    var trunkMat = new THREE.MeshPhongMaterial({ color: 0x6b4a34, shininess: 6 });
    var trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(0, -34, 0);
    trunk.scale.y = 0.001;
    scene.add(trunk);

    var branchGeo = new THREE.CylinderGeometry(0.7, 1.1, 1, 6);
    branchGeo.translate(0, 0.5, 0);
    var branchMat = new THREE.MeshPhongMaterial({ color: 0x6b4a34, shininess: 6 });
    var branchL = new THREE.Mesh(branchGeo, branchMat);
    branchL.position.set(-4, -6, 0);
    branchL.rotation.z = 0.9;
    branchL.scale.y = 0.001;
    scene.add(branchL);
    var branchR = new THREE.Mesh(branchGeo, branchMat);
    branchR.position.set(4, 2, 0);
    branchR.rotation.z = -0.9;
    branchR.scale.y = 0.001;
    scene.add(branchR);

    function buildPetalGeometry(){
        var geo = new THREE.PlaneGeometry(1,1,4,6);
        geo.translate(0,0.5,0);
        var pos = geo.attributes.position;
        for (var i=0;i<pos.count;i++){
            var x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
            var t = Math.max(0, Math.min(1,y));
            var w = Math.max(Math.sin(Math.pow(t,0.75)*Math.PI), 0.001);
            pos.setX(i, x*w);
            pos.setZ(i, z + Math.sin(t*Math.PI*0.5)*3 - Math.pow(Math.abs(x),1.6)*2.2);
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
        return geo;
    }
    var PETAL_GEO = buildPetalGeometry();
    var CLOSED = new THREE.Color(0x2e3b1f);
    var OPEN = new THREE.Color("#ffd83d");

    function makeFlower(x, y, scale){
        var mat = new THREE.MeshPhongMaterial({ color: CLOSED.clone(), shininess:14, side: THREE.DoubleSide });
        var group = new THREE.Group();
        var petals = [];
        var COUNT = 6;
        for (var i=0;i<COUNT;i++){
            var theta = (i/COUNT)*Math.PI*2;
            var yaw = new THREE.Group(); yaw.rotation.y = theta;
            var hinge = new THREE.Group(); yaw.add(hinge);
            var mesh = new THREE.Mesh(PETAL_GEO, mat);
            mesh.scale.set(6*scale, 9*scale, 1);
            hinge.add(mesh);
            group.add(yaw);
            petals.push(hinge);
        }
        group.position.set(x, y, 0);
        scene.add(group);
        return { group: group, petals: petals, mat: mat, scale: scale };
    }
    var flowers = [
        makeFlower(0, 28, 1.1), makeFlower(-8, 16, 0.8), makeFlower(7, 20, 0.85),
        makeFlower(-3, 8, 0.7), makeFlower(5, 5, 0.65)
    ];
    flowers.forEach(function(f){
        f.petals.forEach(function(p){ p.scale.setScalar(0); });
    });

    var TRUNK_END = 1.4, FLOWER_START = 1.1, FLOWER_END = 2.6, HOLD_UNTIL = 3.2, LOOP = 3.9;
    return {
        update: function(t){
            var lt = t % LOOP;
            var trunkT = easeOutCubic(clamp01(lt/TRUNK_END));
            trunk.scale.y = Math.max(0.001, trunkT);
            branchL.scale.y = Math.max(0.001, clamp01((lt-0.3)/1.0));
            branchR.scale.y = Math.max(0.001, clamp01((lt-0.5)/1.0));

            var bt = easeInOutCubic(clamp01((lt-FLOWER_START)/(FLOWER_END-FLOWER_START)));
            var fadeMul = lt > HOLD_UNTIL ? Math.max(0, 1-(lt-HOLD_UNTIL)/(LOOP-HOLD_UNTIL)) : 1;
            flowers.forEach(function(f, i){
                var localT = clamp01(bt - i*0.06);
                f.petals.forEach(function(p, pi){
                    var ang = 0.15 + localT*1.6;
                    p.rotation.z = -ang;
                    p.scale.setScalar((0.3+0.7*localT) * fadeMul);
                });
                f.mat.color.copy(CLOSED).lerp(OPEN, localT);
                f.mat.opacity = fadeMul;
            });
            scene.rotation.y = 0.08*Math.sin(0.4*t);
        }
    };
});
