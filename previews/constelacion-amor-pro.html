<style>
  *{box-sizing:border-box;}
  html, body {
    margin:0; height:100%; background:#000; overflow:hidden;
    font-family:'Dancing Script', cursive;
    touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; }

  #start-screen{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(180deg,#03040d 0%,#0a1232 55%,#1a1040 100%);
    display:flex; justify-content:center; align-items:center; flex-direction:column;
    z-index:3000; color:#dffff4; font-size:2rem; font-weight:700; cursor:pointer;
    transition:opacity 1s ease; text-shadow:0 0 15px #6ef0c8;
  }
  #start-screen.hidden{ opacity:0; pointer-events:none; }
  #start-screen > .sbub{ position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden; pointer-events:none; z-index:0; }
  .sbub::before, .sbub::after{
    content:""; position:absolute; left:-30%; right:-30%; border-radius:50%; filter:blur(36px);
  }
  .sbub::before{
    top:4%; height:40%;
    background:linear-gradient(90deg, transparent, rgba(110,240,200,.42), rgba(120,150,255,.34), rgba(200,120,255,.28), transparent);
    animation:auroraWave 9s ease-in-out infinite alternate;
  }
  .sbub::after{
    top:26%; height:30%;
    background:linear-gradient(90deg, transparent, rgba(200,120,255,.3), rgba(110,240,200,.32), transparent);
    animation:auroraWave 12s ease-in-out -4s infinite alternate-reverse;
  }
  @keyframes auroraWave{ from{ transform:translateX(-9%) skewX(-9deg) scaleY(.85); } to{ transform:translateX(9%) skewX(9deg) scaleY(1.25); } }
  .sbub i{ position:absolute; border-radius:50%; background:#fff; animation:stTwinkle ease-in-out infinite alternate; }
  @keyframes stTwinkle{ from{ opacity:.15; transform:scale(.7); } to{ opacity:1; transform:scale(1.25); } }
  .sbub b{
    position:absolute; top:-10px; width:110px; height:2px;
    background:linear-gradient(90deg, transparent, #fff);
    transform:rotate(-30deg); opacity:0; animation:stShoot 7s linear infinite;
  }
  @keyframes stShoot{ 0%{ opacity:0; transform:translate(0,0) rotate(-30deg); } 3%{ opacity:1; } 14%{ opacity:0; transform:translate(-360px,210px) rotate(-30deg); } 100%{ opacity:0; transform:translate(-360px,210px) rotate(-30deg); } }
  .pulse-text{ animation:pulse 1.5s infinite alternate; letter-spacing:.5px; }
  @keyframes pulse{ 0%{transform:scale(1);opacity:.8} 100%{transform:scale(1.1);opacity:1} }
  .start-heart{
    margin-top:28px; font-size:3.4rem; position:relative; display:inline-block;
    animation: starBob 4s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(110,240,200,.75));
  }
  @keyframes starBob{ 0%,100%{ transform:translateY(0) rotate(-6deg); } 50%{ transform:translateY(-10px) rotate(6deg); } }
  .start-heart::before{
    content:""; position:absolute; left:50%; top:50%; width:104px; height:104px; margin:-52px 0 0 -52px;
    border-radius:50%; z-index:-1;
    border:1.5px dashed rgba(110,240,200,.45);
    background:radial-gradient(circle, rgba(110,240,200,.22), rgba(110,240,200,0) 70%);
    animation: starOrbit 14s linear infinite;
  }
  @keyframes starOrbit{ to{ transform:rotate(360deg); } }
  @media (max-width:480px){ .start-heart{ font-size:2.7rem; margin-top:16px; } }

  #top-title{
    position:fixed; top:20px; left:0; width:100%; text-align:center;
    z-index:1500; pointer-events:none;
    font-family:'Dancing Script', cursive; font-weight:700; font-size:2.8rem; letter-spacing:1px;
    background:linear-gradient(90deg,#effff9,#6ef0c8,#7a8bff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 14px rgba(110,240,200,.55));
    animation:titlePulse 1.8s ease-in-out infinite;
  }
  @keyframes titlePulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }
  @media (max-width:480px){ #top-title{ font-size:1.9rem; top:14px; } }

  #love-letter-btn{
    position:fixed; bottom:24px; right:24px; z-index:1800;
    width:60px; height:60px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#1d5a52,#6ef0c8);
    box-shadow:0 0 18px rgba(110,240,200,.6), 0 4px 14px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; font-size:1.55rem;
    animation:btnBeat 1.8s ease-in-out infinite; transition:transform .25s ease;
  }
  #love-letter-btn:hover{ transform:scale(1.08); }
  @keyframes btnBeat{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

  #love-letter-overlay{
    position:fixed; inset:0; background:rgba(2,10,14,.84);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    z-index:2500; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .4s ease; padding:24px;
  }
  #love-letter-overlay.visible{ opacity:1; pointer-events:auto; }
  #love-letter-card{
    max-width:620px; width:100%; max-height:82vh; overflow-y:auto;
    background:linear-gradient(160deg,rgba(10,34,44,.96),rgba(2,8,12,.98));
    border:1px solid rgba(110,240,200,.35); border-radius:22px;
    padding:40px 32px; box-shadow:0 0 40px rgba(110,240,200,.35);
    color:#ecfff8; font-family:'Dancing Script', cursive;
    transform:translateY(18px) scale(.96); transition:transform .4s ease; position:relative;
  }
  #love-letter-overlay.visible #love-letter-card{ transform:translateY(0) scale(1); }
  #love-letter-card h2{
    text-align:center; margin:0 0 22px; font-size:2rem; font-weight:700;
    background:linear-gradient(90deg,#effff9,#6ef0c8,#7a8bff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  #love-letter-card p{ line-height:1.8; font-size:1.25rem; margin:0 0 16px; }
  #love-letter-close{
    position:absolute; top:14px; right:16px; background:none; border:none;
    color:#b8ffe6; font-size:1.35rem; cursor:pointer; line-height:1; padding:4px;
  }
  #love-letter-close:hover{ color:#fff; }
  @media (max-width:480px){
    #love-letter-btn{ width:52px; height:52px; font-size:1.3rem; bottom:18px; right:18px; }
    #love-letter-card{ padding:30px 22px; border-radius:18px; }
    #love-letter-card h2{ font-size:1.6rem; }
    #love-letter-card p{ font-size:1.1rem; }
  }

/* ============================================================
   EDITOR LINK EMOCIONAL  (inyectado)
   ============================================================ */
:root{
  --le-accent: #6ef0c8;
  --le-accent-soft: rgba(110,240,200,0.14);
  --le-bg: #06121a;
  --le-panel: rgba(6,18,26,0.92);
  --le-text: #ecfff8;
  --le-muted: #7fb3aa;
  --le-line: rgba(110,240,200,0.24);
}

/* ---- boton lapiz ---- */
.le-edit-toggle{
  position:fixed; top:16px; right:16px;
  width:50px; height:50px; border-radius:50%;
  background:rgba(10,8,4,0.5);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--le-line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:3600;
  box-shadow:0 0 0 0 rgba(0,0,0,0);
  transition:transform .15s ease, background .15s ease;
  animation: leEditIn .6s cubic-bezier(.2,.9,.25,1.2) .3s both, leEditGlow 2.8s ease-in-out 1.1s infinite;
}
@keyframes leEditIn{
  0%{ opacity:0; transform:scale(.4) rotate(-25deg); }
  100%{ opacity:1; transform:scale(1) rotate(0deg); }
}
@keyframes leEditGlow{
  0%,100%{ box-shadow:0 0 0 0 rgba(0,0,0,0), 0 0 14px 0 var(--le-accent-soft); }
  50%{ box-shadow:0 0 0 7px rgba(0,0,0,0), 0 0 22px 3px var(--le-accent-soft); }
}
.le-edit-toggle::after{
  content:""; position:absolute; inset:-6px; border-radius:50%;
  border:1.5px solid var(--le-accent); opacity:.55;
  animation: leEditRing 2.8s ease-out 1.1s infinite;
  pointer-events:none;
}
@keyframes leEditRing{
  0%{ transform:scale(.82); opacity:.6; }
  70%{ opacity:0; }
  100%{ transform:scale(1.35); opacity:0; }
}
.le-edit-toggle:hover{ transform:scale(1.08); background:rgba(10,8,4,0.75); animation-play-state:paused; }
.le-edit-toggle svg{ width:20px; height:20px; position:relative; z-index:1; }
.le-edit-hint{
  position:fixed; top:22px; right:74px; z-index:3599;
  background:rgba(10,8,4,0.75); border:1px solid var(--le-line); color:var(--le-text);
  font-family:'Quicksand',sans-serif; font-size:11.5px; font-weight:700;
  padding:7px 12px; border-radius:999px; white-space:nowrap;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  opacity:0; transform:translateX(6px);
  animation: leHint 8s ease-in-out 1.6s infinite;
  pointer-events:none;
}
@keyframes leHint{
  0%,72%{ opacity:0; transform:translateX(6px); }
  80%,92%{ opacity:1; transform:translateX(0); }
  100%{ opacity:0; transform:translateX(6px); }
}
body.le-no-editor .le-edit-toggle,
body.le-no-editor .le-edit-hint{ display:none !important; }

/* ---- pagina del editor ---- */
.le-editor-page{
  display:none; position:relative; z-index:50; min-height:100%;
  color:var(--le-text);
  font-family:'Quicksand','Segoe UI',Arial,sans-serif;
}
html.le-editing{ overflow-y:auto !important; overflow-x:hidden !important; height:auto !important; touch-action:auto !important; background:var(--le-bg) !important; }
body.le-editor{ overflow-y:auto !important; overflow-x:hidden !important; background:var(--le-bg) !important; touch-action:auto !important; height:auto !important; }
body.le-editor .le-editor-page{ display:block; }
body.le-editor #start-screen,
body.le-editor #top-title,
body.le-editor #love-letter-btn,
body.le-editor #love-letter-overlay,
body.le-editor .le-edit-toggle,
body.le-editor .le-edit-hint{ display:none !important; }
body.le-no-editor .le-editor-page{ display:none !important; }

#c.le-stage-full{ position:fixed; top:0; left:0; z-index:1; }
#c.le-stage-preview{ position:relative !important; display:block; width:100% !important; height:100% !important; }

.le-topbar{
  position:sticky; top:0; display:flex; align-items:center; gap:14px;
  padding:14px 18px; background:var(--le-panel);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--le-line); z-index:60;
}
.le-back{
  width:40px; height:40px; flex:0 0 auto; border-radius:50%;
  background:rgba(255,255,255,0.06); border:1px solid var(--le-line);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--le-text);
}
.le-back:hover{ background:rgba(255,255,255,0.13); }
.le-back svg{ width:19px; height:19px; }
.le-titles{ flex:1 1 auto; min-width:0; }
.le-titles h1{ font-size:16px; margin:0; font-weight:700; }
.le-titles p{ font-size:11.5px; margin:2px 0 0; color:var(--le-muted); }
.le-brand{
  margin-left:auto; flex:0 0 auto;
  font-weight:700; font-size:14px; letter-spacing:0.4px; white-space:nowrap;
  background:linear-gradient(90deg,#72CBE9,#745FC9);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  pointer-events:none; user-select:none;
}

.le-body{ max-width:640px; margin:0 auto; padding:18px 18px 70px; }

.le-preview{
  position:relative; width:100%; aspect-ratio:4/3;
  border-radius:20px; overflow:hidden;
  border:1px solid var(--le-line); background:#000;
  box-shadow:0 10px 30px rgba(0,0,0,0.45); margin-bottom:24px;
}
.le-preview .le-tag{
  position:absolute; top:10px; left:12px; font-size:10.5px; font-weight:700;
  letter-spacing:0.06em; text-transform:uppercase; color:var(--le-accent);
  background:rgba(0,0,0,0.5); border:1px solid var(--le-line);
  padding:4px 9px; border-radius:999px; pointer-events:none; z-index:5;
}

.le-sec{ margin-bottom:26px; }
.le-sec h3{ font-size:13.5px; font-weight:700; margin:0 0 3px; color:var(--le-text); }
.le-sec p.le-hint{ font-size:12px; color:var(--le-muted); margin:0 0 12px; line-height:1.5; }

.le-input, .le-area{
  width:100%; box-sizing:border-box;
  background:rgba(255,255,255,0.05); border:1px solid var(--le-line);
  color:var(--le-text); padding:11px; border-radius:8px;
  font-family:'Quicksand',sans-serif; font-size:14px; font-weight:600;
}
.le-area{ min-height:150px; line-height:1.6; font-weight:500; resize:vertical; }

.le-color-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.le-color-row input[type=color]{ width:44px; height:44px; border:2px solid var(--le-line); border-radius:11px; background:none; cursor:pointer; padding:0; flex:0 0 auto; }
.le-color-row input[type=text]{ flex:1 1 140px; min-width:0; }
.le-swatches{ display:flex; gap:8px; flex-wrap:wrap; }
.le-sw{ width:28px; height:28px; border-radius:8px; border:2px solid rgba(255,255,255,0.15); cursor:pointer; transition:transform .12s ease; flex-shrink:0; }
.le-sw:hover{ transform:scale(1.12); }
.le-sw.active{ border-color:#fff; }

.le-opts{ display:flex; flex-wrap:wrap; gap:8px; }
.le-opt{
  flex:1 1 95px; background:rgba(255,255,255,0.04); border:1px solid var(--le-line);
  border-radius:9px; padding:11px 8px; cursor:pointer; font-size:15px;
  color:var(--le-text); text-align:center; line-height:1.2;
}
.le-opt small{ display:block; font-size:9.5px; font-weight:700; color:var(--le-muted); margin-top:3px; font-family:'Quicksand',sans-serif; }
.le-opt.active{ border-color:var(--le-accent); color:var(--le-accent); background:var(--le-accent-soft); }
.le-opt.active small{ color:var(--le-accent); opacity:.85; }

.le-chips{ display:flex; flex-direction:column; gap:7px; margin-bottom:10px; max-height:280px; overflow-y:auto; }
.le-chip{ display:flex; align-items:center; gap:9px; background:rgba(255,255,255,0.045); border:1px solid var(--le-line); border-radius:8px; padding:10px 9px 10px 13px; }
.le-chip span{ flex:1; font-size:13.5px; font-weight:600; word-break:break-word; }
.le-chip button{ background:none; border:none; color:var(--le-muted); font-size:16px; cursor:pointer; padding:3px 6px; border-radius:5px; }
.le-chip button:hover{ color:#ff9fc8; }
.le-empty{ font-size:12px; color:var(--le-muted); font-style:italic; padding:5px 2px; opacity:.8; }

.le-add-row{ display:flex; gap:8px; flex-wrap:wrap; }
.le-add-row input[type=text]{ flex:1 1 160px; min-width:0; }
.le-btn{ border:none; border-radius:8px; padding:11px 16px; font-family:'Quicksand',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
.le-btn-add{ background:var(--le-accent-soft); color:var(--le-accent); border:1px solid var(--le-line); flex:0 0 auto; }
.le-btn-clear{ background:none; color:var(--le-muted); border:1px solid var(--le-line); font-size:11.5px; padding:8px 12px; margin-top:8px; }
.le-btn-clear:hover{ color:#ff9fc8; border-color:#ff9fc8; }

.le-grid{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:10px; }
.le-thumb{ width:60px; height:60px; border-radius:14px; background-size:cover; background-position:center; position:relative; border:1px solid var(--le-line); }
.le-thumb button{ position:absolute; top:-6px; right:-6px; width:21px; height:21px; border-radius:50%; background:#1a1208; border:1px solid var(--le-line); color:var(--le-text); font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.le-add-tile{ width:60px; height:60px; border-radius:14px; border:1.5px dashed var(--le-line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--le-muted); font-size:24px; flex-shrink:0; }
.le-add-tile.disabled{ opacity:.35; pointer-events:none; }
.le-add-tile input{ display:none; }
.le-note{ font-size:11px; color:var(--le-muted); margin-top:2px; }

.le-switch{ display:flex; align-items:center; gap:10px; padding:11px 12px; background:rgba(255,255,255,0.04); border:1px solid var(--le-line); border-radius:9px; margin-bottom:8px; cursor:pointer; }
.le-switch input{ width:18px; height:18px; accent-color:var(--le-accent); flex:0 0 auto; }
.le-switch span{ font-size:13px; font-weight:600; }

.le-range .le-label{ font-size:12px; color:var(--le-muted); margin-bottom:6px; }
.le-range input[type=range]{ width:100%; accent-color:var(--le-accent); }

.le-footer{ margin-top:6px; padding-top:20px; border-top:1px solid var(--le-line); }
.le-check{ display:flex; align-items:flex-start; gap:9px; margin-bottom:14px; }
.le-check input{ margin-top:3px; flex:0 0 auto; accent-color:var(--le-accent); }
.le-check label{ font-size:12px; color:var(--le-muted); line-height:1.5; }
.le-btn-dl{ width:100%; background:var(--le-accent); color:#1a1200; padding:15px 16px; font-size:14.5px; border-radius:10px; }
.le-btn-dl:hover{ filter:brightness(1.08); }
.le-file-row{ margin-top:12px; }
.le-save-note{ font-size:11.5px; color:var(--le-muted); line-height:1.5; margin-top:14px; }

/* ============================================================
   PANTALLA DE INICIO (mejora compartida entre plantillas)
   ============================================================ */
#start-screen{ overflow:hidden; }
#start-screen::before{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 22%, #fff, transparent 60%),
    radial-gradient(1.3px 1.3px at 28% 68%, #fff, transparent 60%),
    radial-gradient(1.8px 1.8px at 42% 15%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 58% 78%, #fff, transparent 60%),
    radial-gradient(1.6px 1.6px at 74% 32%, #fff, transparent 60%),
    radial-gradient(1.3px 1.3px at 86% 62%, #fff, transparent 60%),
    radial-gradient(1.5px 1.5px at 20% 85%, #fff, transparent 60%),
    radial-gradient(1.4px 1.4px at 92% 20%, #fff, transparent 60%),
    radial-gradient(1.3px 1.3px at 65% 90%, #fff, transparent 60%),
    radial-gradient(1.7px 1.7px at 8% 50%, #fff, transparent 60%);
  opacity:.65;
  animation: leStarsTwinkle 3.2s ease-in-out infinite alternate;
}
@keyframes leStarsTwinkle{ 0%{ opacity:.32; } 100%{ opacity:.85; } }
#start-screen::after{
  content:""; position:absolute; left:50%; top:50%; z-index:0; pointer-events:none;
  width:70vmax; height:70vmax; border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, var(--le-accent-soft) 0%, transparent 68%);
  animation: leAuraPulse 4.6s ease-in-out infinite;
}
@keyframes leAuraPulse{ 0%,100%{ opacity:.5; transform:translate(-50%,-50%) scale(0.92); } 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); } }
#start-screen > *{ position:relative; z-index:1; }
.pulse-text{
  animation: leTextIn .8s cubic-bezier(.2,.85,.3,1.1) both, leTextGlow 2.6s ease-in-out 1s infinite alternate;
  letter-spacing:.5px;
  padding:13px 28px; border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(0,0,0,0.22));
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:
    0 6px 26px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 0 0 1px rgba(255,255,255,0.06),
    0 0 0 1px var(--le-accent-soft);
}
@keyframes leTextIn{
  0%{ opacity:0; transform:translateY(14px) scale(.94); letter-spacing:2px; }
  100%{ opacity:1; transform:translateY(0) scale(1); letter-spacing:.5px; }
}
@keyframes leTextGlow{ 0%{ filter:brightness(1); } 100%{ filter:brightness(1.22); } }
.start-heart::after{
  content:""; position:absolute; left:50%; top:50%; z-index:-2;
  width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%;
  border:1.5px solid var(--le-accent);
  opacity:0;
  animation: leTapRipple 2.6s ease-out .9s infinite;
}
@keyframes leTapRipple{
  0%{ width:34px; height:34px; margin:-17px 0 0 -17px; opacity:.65; }

<script>
/* ============================================================
   CONSTELACIÓN DE AMOR — escena 3D (auroras, constelaciones, tus estrellas)
   ============================================================ */
const isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || window.innerWidth <= 820;

/* ---------- inicio / audio ---------- */
const startScreen = document.getElementById('start-screen');
const audio = document.getElementById('audio');

audio.preload = 'auto';
try { audio.load(); } catch(e){}

let experienceStarted = false;
function unlockAudioAndStart(){

  if (pp && typeof pp.catch === 'function') pp.catch(function(){});
  startScreen.classList.add('hidden');
}

startScreen.addEventListener('click', unlockAudioAndStart);

/* ---------- carta ---------- */
document.getElementById('top-title').textContent = CONFIG.titulo;
const letterBody = document.getElementById('love-letter-body');
String(CONFIG.mensaje || '').split(/\n\s*\n/).forEach(function(par){
  const p = document.createElement('p');
  p.textContent = par.trim();
  letterBody.appendChild(p);
});
const letterBtn = document.getElementById('love-letter-btn');
const letterOverlay = document.getElementById('love-letter-overlay');
const letterClose = document.getElementById('love-letter-close');
letterBtn.addEventListener('click', function(){ letterOverlay.classList.add('visible'); });
letterClose.addEventListener('click', function(){ letterOverlay.classList.remove('visible'); });
letterOverlay.addEventListener('click', function(e){ if (e.target === letterOverlay) letterOverlay.classList.remove('visible'); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') letterOverlay.classList.remove('visible'); });

/* ---------- renderer ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: !isMobile});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 6000);

let targetDist = 430, currentDist = 430;
let rotX = 0.18, rotY = 0;

/* ---------- texturas base ---------- */
function makeDotTexture(){
  const size = 64;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0.0,'rgba(255,255,255,1)');
  g.addColorStop(0.55,'rgba(255,255,255,1)');
  g.addColorStop(0.85,'rgba(255,255,255,0.55)');
  g.addColorStop(1.0,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const dotTexture = makeDotTexture();

function petalTexture(){
  const size = 128;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.translate(size/2, size/2);
  const g = ctx.createRadialGradient(0,-size*0.12,2,0,0,size*0.46);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.55,'rgba(255,255,255,0.75)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, size*0.22, size*0.44, 0, 0, Math.PI*2);
  ctx.fill();
  return new THREE.CanvasTexture(c);
}
const petalTex = petalTexture();

function makeAurora(size, hex){
  size = size || 1024;
  const rgb = function(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; };
  const mul = function(h,k,a){ const c=rgb(h); return 'rgba('+Math.min(255,Math.round(c[0]*k))+','+Math.min(255,Math.round(c[1]*k))+','+Math.min(255,Math.round(c[2]*k))+','+(a==null?1:a)+')'; };
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,size);
  g.addColorStop(0, '#03040d');
  g.addColorStop(0.5, '#0a1030');
  g.addColorStop(0.82, '#1b1244');
  g.addColorStop(1, mul(hex,0.3));
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  /* resplandor de amanecer en el horizonte */
  const dawn = ctx.createRadialGradient(size*0.5,size*1.02,0,size*0.5,size*1.02,size*0.7);
  dawn.addColorStop(0, mul(hex,1,0.45)); dawn.addColorStop(0.4,'rgba(255,150,120,0.18)'); dawn.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = dawn; ctx.fillRect(0,0,size,size);
  /* montañas y lago */
  ctx.fillStyle = 'rgba(4,6,16,0.95)';
  ctx.beginPath(); ctx.moveTo(0,size);
  for (let x=0;x<=size;x+=12){ ctx.lineTo(x, size*0.86 - Math.abs(Math.sin(x*0.006+1))*size*0.07 - Math.abs(Math.sin(x*0.017))*size*0.025); }
  ctx.lineTo(size,size); ctx.closePath(); ctx.fill();
  const lake = ctx.createLinearGradient(0,size*0.9,0,size);
  lake.addColorStop(0,'rgba(10,18,40,0.9)'); lake.addColorStop(1, mul(hex,0.25,0.9));
  ctx.fillStyle = lake; ctx.fillRect(0,size*0.9,size,size*0.1);
  for (let i=0;i<260;i++){
    ctx.fillStyle = 'rgba(235,245,255,'+(Math.random()*0.6)+')';
    const s = Math.random()*1.7;
    ctx.fillRect(Math.random()*size, Math.random()*size*0.82, s, s);
  }
  const vig = ctx.createRadialGradient(size*0.5,size*0.5,size*0.35,size*0.5,size*0.5,size*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
scene.background = makeAurora(1024, CONFIG.color || '#6ef0c8');

/* ---------- estrellas de fondo ---------- */
(function makeStars(count, spread){
  count = count || (isMobile ? 1600 : 2600); spread = spread || 3200;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for (let i=0;i<count;i++){
    const r = spread*(0.3 + Math.random()*0.7);
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 2.2, sizeAttenuation:false, map: dotTexture, transparent:true,
    alphaTest:0.01, depthWrite:false, opacity:0.9, color:0xe6fff4
  })));
})();

/* ---------- lluvia de destellos (cae despacio por todo el universo) ---------- */
const FALL_COUNT = isMobile ? 200 : 340;
const FALL_SPREAD = 1300;
const fallPos = new Float32Array(FALL_COUNT*3);
const fallData = [];
for (let i=0;i<FALL_COUNT;i++){
  fallPos[i*3]   = (Math.random()-0.5)*FALL_SPREAD*2;
  fallPos[i*3+1] = (Math.random()-0.5)*FALL_SPREAD*1.1;
  fallPos[i*3+2] = (Math.random()-0.5)*FALL_SPREAD*2;
  fallData.push({ speed: 5 + Math.random()*13, flick: Math.random()*Math.PI*2, flickSpeed: 1 + Math.random()*2.2 });
}
const fallGeom = new THREE.BufferGeometry();
fallGeom.setAttribute('position', new THREE.BufferAttribute(fallPos,3));
const fallMat = new THREE.PointsMaterial({
  size: 2.4, sizeAttenuation:true, map: dotTexture, transparent:true,
  alphaTest:0.01, depthWrite:false, opacity:0.8, color:0xffffff, blending: THREE.AdditiveBlending
});
const fallStars = new THREE.Points(fallGeom, fallMat);
scene.add(fallStars);


/* ============================================================
   FIGURA CENTRAL DE PARTÍCULAS (morph entre dos formas)
   ============================================================ */
function curveFor(kind, t){
  if (kind === 'anillos'){
    const cx = (t < Math.PI*2) ? -19 : 19;
    return { x: cx + 33*Math.cos(t), y: 33*Math.sin(t) };
  }
  if (kind === 'medusa'){
    if (t < Math.PI) return { x: 46*Math.cos(t), y: 44*Math.sin(t) + 2 };
    const u = (t - Math.PI)/Math.PI;
    return { x: -46 + 92*u, y: -8 - 17*Math.abs(Math.sin(u*Math.PI*6)) };
  }
  if (kind === 'caracola'){
    const r = 5.5*Math.exp(0.2*t);
    return { x: r*Math.cos(t) + 6, y: r*Math.sin(t) };
  }
  if (kind === 'capullo'){
    const r = 10*(1 + 0.20*Math.cos(6*t));
    return { x: r*Math.cos(t), y: r*Math.sin(t) };
  }
  if (kind === 'rosaAbierta'){
    let r = (0.55 + 0.45*Math.cos(5*t)) * 58;
    r *= (1 + 0.09*Math.cos(15*t));
    return { x: r*Math.cos(t), y: r*Math.sin(t) };
  }
  if (kind === 'mariposa'){
    const r = Math.exp(Math.cos(t)) - 2*Math.cos(4*t) - Math.pow(Math.sin(t/12),5);
    return { x: Math.sin(t)*r*11.5, y: Math.cos(t)*r*11.5 - 6 };
  }
  if (kind === 'infinito'){
    const d = 1 + Math.sin(t)*Math.sin(t);
    return { x: (Math.cos(t)/d)*56, y: (Math.sin(t)*Math.cos(t)/d)*56 };
  }
  if (kind === 'flor'){
    const r = Math.cos(5*t)*52;
    return { x: r*Math.cos(t), y: r*Math.sin(t) };
  }
  if (kind === 'estrella'){
    const tot = 10, va = Math.PI*2/tot;
    const u = (t % (Math.PI*2)) / va;
    const k = Math.floor(u), f = u - k;
    const r0 = (k%2===0) ? 52 : 23, r1 = ((k+1)%2===0) ? 52 : 23;
    const a0 = -Math.PI/2 + k*va, a1 = -Math.PI/2 + (k+1)*va;
    const r = r0 + (r1-r0)*f, a = a0 + (a1-a0)*f;
    return { x: r*Math.cos(a), y: r*Math.sin(a) };
  }
  if (kind === 'luna'){
    return { x: Math.cos(t)*52, y: Math.sin(t)*52 };
  }
  /* corazon */
  const x = 16*Math.pow(Math.sin(t),3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return { x: x*3.3, y: y*3.3 + 20 };
}

const SHAPE_TMAX = { anillos: Math.PI*4, medusa: Math.PI*2, caracola: Math.PI*4, capullo: Math.PI*2, rosaAbierta: Math.PI*2, mariposa: 12*Math.PI, infinito: Math.PI*2, flor: Math.PI*2, estrella: Math.PI*2, luna: Math.PI*2, corazon: Math.PI*2 };

function cupHeight(kind, r){
  if (kind === 'capullo')     return 15 * (1 - Math.min(1, r/13));
  if (kind === 'rosaAbierta') return 22 * (1 - Math.min(1, r/58));
  return 0;
}

function buildShape(kind, count, seeds){
  const arr = new Float32Array(count*3);
  const tmax = SHAPE_TMAX[kind] || Math.PI*2;

  /* la luna se muestrea por relleno: disco grande menos disco desplazado */
  if (kind === 'luna'){
    const R = 56, r2 = 47, dx = 21;
    for (let i=0;i<count;i++){
      let x = 0, y = 0, tries = 0;
      do {
        const rr = Math.sqrt(Math.random())*R;
        const aa = Math.random()*Math.PI*2;
        x = rr*Math.cos(aa); y = rr*Math.sin(aa);
        tries++;
      } while (Math.hypot(x-dx, y) < r2 && tries < 60);
      arr[i*3] = x; arr[i*3+1] = y; arr[i*3+2] = (Math.random()-0.5)*9;
    }
    return arr;
  }

  for (let i=0;i<count;i++){
    const t = seeds[i]*tmax;
    const p0 = curveFor(kind, t);
    const p1 = curveFor(kind, t + 0.002);
    let tx = p1.x-p0.x, ty = p1.y-p0.y;
    const len = Math.hypot(tx,ty) || 1;
    const nx = -ty/len, ny = tx/len;
    const off = (seeds[(i+7)%count]-0.5) * 5.5;
    const px = p0.x + nx*off, py = p0.y + ny*off;
    arr[i*3]   = px;
    arr[i*3+1] = py;
    arr[i*3+2] = (seeds[(i+13)%count]-0.5) * 9 + cupHeight(kind, Math.hypot(px,py));
  }
  return arr;
}

const HOLD = 6, MORPH = 2.6;
const CYCLE = (HOLD + MORPH) * 2;
function easeInOutCubic(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }
function mixAt(sec){
  const p = sec % CYCLE;
  if (p < HOLD) return 0;
  if (p < HOLD + MORPH) return easeInOutCubic((p-HOLD)/MORPH);
  if (p < HOLD*2 + MORPH) return 1;
  return 1 - easeInOutCubic((p - HOLD*2 - MORPH)/MORPH);
}

const COLORS = ['#6ef0c8','#5effd0','#7ab8ff','#b6f6ff','#3aa0ff','#9af7e6','#66e0ff','#c8f2ff','#a6a0ff'];

document.fonts.ready.then(function(){

    const sp = new THREE.Sprite(mat);

/* ============================================================

const photoGroup = new THREE.Group(); scene.add(photoGroup);

PHOTO_INSTANCES.forEach(function(path){

  const theta = Math.random()*Math.PI*2;

    const iw = (tex.image && tex.image.width) || 1;
    const ih = (tex.image && tex.image.height) || 1;
    const ratio = iw/ih;
    const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, opacity:0.95});
    const sp = new THREE.Sprite(mat);
    if (ratio >= 1) sp.scale.set(base*ratio, base, 1); else sp.scale.set(base, base/ratio, 1);
    sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));

/* ============================================================
   CONTROLES
   ============================================================ */
let isPointerDown = false, startX = 0, startY = 0;
let targetRotX = 0.18, targetRotY = 0, velX = 0, velY = 0;

function onDown(e){
  isPointerDown = true; velX = 0; velY = 0;
  const t = e.touches ? e.touches[0] : e;
  startX = t.clientX; startY = t.clientY;
}
function onMove(e){
  if (!isPointerDown) return;
  if (e.touches && e.touches.length > 1) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - startX, dy = t.clientY - startY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2){
    const sensX = (Math.PI*1.5)/innerWidth, sensY = (Math.PI*0.8)/innerHeight;
    velY = -dx*sensX; velX = dy*sensY;
    targetRotY += velY;
    targetRotX = Math.max(-1.25, Math.min(1.25, targetRotX + velX));
    startX = t.clientX; startY = t.clientY;
  }

/* ============================================================
   ANIMACIÓN
   ============================================================ */
let t = 0;
let lastMs = performance.now();
const INERTIA = 0.88;

function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  const dt = Math.min(0.05, (now-lastMs)/1000);
  lastMs = now;
  t += 0.01;

  try {

  if (!isPointerDown){
    velX *= INERTIA; velY *= INERTIA;
    targetRotX = Math.max(-1.25, Math.min(1.25, targetRotX + velX));

  }
  rotX += (targetRotX - rotX)*0.12;
  rotY += (targetRotY - rotY)*0.12;

  ring1.rotation.z += 0.0022;
  ring2.rotation.z -= 0.0016;
  dust.rotation.y  += 0.0006;

  const gs = 470*(1 + Math.sin(t*0.4)*0.035);
  glow.scale.set(gs, gs, 1);

  const beat = 1.0 + 0.045*Math.sin(t*3.4);
  heart.scale.set(beat, beat, beat);

  const elapsed = (now - sceneStart)/1000;
  const mix = mixAt(elapsed);
  const arr = heartGeom.attributes.position.array;
  for (let i=0;i<FIG_COUNT;i++){
    const ix = i*3;
    arr[ix]   = shapeA[ix]   + (shapeB[ix]   - shapeA[ix])*mix;
    arr[ix+1] = shapeA[ix+1] + (shapeB[ix+1] - shapeA[ix+1])*mix;
    arr[ix+2] = shapeA[ix+2] + (shapeB[ix+2] - shapeA[ix+2])*mix;
  }
  heartGeom.attributes.position.needsUpdate = true;
  heart.rotation.y += 0.0011;

  /* ---- auroras, constelaciones, tus estrellas, luciérnagas ---- */
  oceanTime += dt;
  if (curtainGroup.visible) updateCurtains(oceanTime);
  if (conGroup.visible) updateConstellations(oceanTime);
  updateUserStars(dt);
  if (spiral.visible){
    const pp = petalGeom.attributes.position.array;
    for (let i=0;i<PETAL_COUNT;i++){
      const d = petalData[i];
      const ix = i*3;
      pp[ix+1] += d.speed*dt;
      d.sway += dt*0.7;
      pp[ix]   += Math.cos(d.sway)*d.swayAmp*dt;
      pp[ix+2] += Math.sin(d.sway*0.8)*d.swayAmp*dt;
      if (pp[ix+1] > 240){
        const r = 40 + Math.random()*330, a = Math.random()*Math.PI*2;
        pp[ix] = Math.cos(a)*r; pp[ix+1] = -240; pp[ix+2] = Math.sin(a)*r;
      }
    }
    petalGeom.attributes.position.needsUpdate = true;
    spiralMat.opacity = 0.7 + 0.2*Math.sin(oceanTime*2.2);
  }

  /* estrellas fugaces */
  if (CONFIG.fugaces !== false){
    shootTimer -= dt;
    if (shootTimer <= 0){ launchShoot(); shootTimer = 1.2 + Math.random()*2.6; }
  }
  for (let i=0;i<shootPool.length;i++){
    const s = shootPool[i];
    if (!s.userData.alive) continue;
    s.userData.life -= dt/2.2;
    if (s.userData.life <= 0){ s.userData.alive = false; s.visible = false; continue; }
    s.position.addScaledVector(s.userData.vel, dt);
    s.material.opacity = Math.sin(s.userData.life*Math.PI)*0.9;
  }

  /* frases y fotos orbitando */
  textGroup.children.forEach(function(sp){
    sp.material.opacity = 0.8 + 0.2*Math.sin(t*2);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach(function(sp){
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
    if (sp.userData.isPhoto) sp.material.opacity = 0.82 + 0.14*Math.sin(t*1.6 + sp.userData.radius);
  });

  currentDist += (targetDist - currentDist)*0.06;
  camera.position.set(
    currentDist*Math.cos(rotX)*Math.sin(rotY),
    currentDist*Math.sin(rotX),
    currentDist*Math.cos(rotX)*Math.cos(rotY)
  );

  /* lluvia de destellos cayendo */
  {
    const fp = fallGeom.attributes.position.array;
    for (let i=0;i<FALL_COUNT;i++){
      const d = fallData[i];
      const ix = i*3;
      fp[ix+1] -= d.speed*dt*7;
      d.flick += dt*d.flickSpeed;
      if (fp[ix+1] < -FALL_SPREAD*0.55){
        fp[ix]   = (Math.random()-0.5)*FALL_SPREAD*2;
        fp[ix+1] = FALL_SPREAD*0.55;
        fp[ix+2] = (Math.random()-0.5)*FALL_SPREAD*2;
      }
    }
    fallGeom.attributes.position.needsUpdate = true;
    fallMat.opacity = 0.6 + 0.25*Math.sin(t*2.1);
  }

  camera.lookAt(0,0,0);
  } catch(e){ console.warn('tick error', e); }
  renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

    "html,body{font-family:" + f.css + ";}";

  var col = new THREE.Color(hex);
  try { if (S_heartM)  S_heartM.color.set(col); } catch(e){}
  try { if (S_spiralM) S_spiralM.color.set(new THREE.Color(lighten(hex,0.25))); } catch(e){}
  try { if (S_dustM)   S_dustM.color.set(new THREE.Color(lighten(hex,0.6))); } catch(e){}

  try {
    if (S_glow && S_glow.material){
      if (S_glow.material.map) S_glow.material.map.dispose();
      S_glow.material.map = glowTex(hex);
      S_glow.material.needsUpdate = true;
    }
  } catch(e){}

  try {
    var rt = ringTex(hex);
    [S_ring1,S_ring2].forEach(function(r){
      if (r && r.material){
        if (r.material.map) r.material.map.dispose();
        r.material.map = rt;
        r.material.needsUpdate = true;
      }
    });
  } catch(e){}

  try { if (S_ring3 && S_ring3.material) S_ring3.material.color.set(new THREE.Color(lighten(hex,0.35))); } catch(e){}
  try { if (S_planetRing && S_planetRing.material) S_planetRing.material.color.set(new THREE.Color(lighten(hex,0.45))); } catch(e){}
  try {
    if (typeof gemEdges !== "undefined" && gemEdges && gemEdges.material) gemEdges.material.color.set(new THREE.Color(lighten(hex,0.35)));
    if (typeof gemFill  !== "undefined" && gemFill  && gemFill.material)  gemFill.material.color.set(new THREE.Color(lighten(hex,0.55)));
    if (typeof ribbonMat !== "undefined" && ribbonMat) ribbonMat.color.set(new THREE.Color(lighten(hex,0.6)));
  } catch(e){}

  if (APP.nebula){
    try {
      if (S_scene.background && S_scene.background.dispose) S_scene.background.dispose();
      S_scene.background = (typeof makeAurora === "function") ? makeAurora(1024, hex) : nebulaTexFor(hex);
    } catch(e){}
  }

  // halos de las fotos
  try {
    if (S_photoG){
      var pg = glowTex(hex, 512);
      S_photoG.children.forEach(function(sp){
        if (sp.userData && sp.userData.isGlow && sp.material){ sp.material.map = pg; sp.material.needsUpdate = true; }
      });
    }
  } catch(e){}

  try { if (typeof regenWreath === "function") regenWreath(hex); } catch(e){}
  try { if (typeof oceanRecolor === "function") oceanRecolor(hex); } catch(e){}

  // colores de las partículas de efectos
  EFFECT_COLORS = palette(hex);
}

/* ============================================================
   RECONSTRUIR FRASES Y FOTOS (vista previa en vivo)
   ============================================================ */
function clearGroup(grp){
  if (!grp) return;
  for (var i = grp.children.length - 1; i >= 0; i--){
    var ch = grp.children[i];
    grp.remove(ch);
    if (ch.material){
      if (ch.material.map && ch.material.map.dispose) ch.material.map.dispose();
      ch.material.dispose();
    }
  }
}

function rebuildFrases(){
  if (!S_textG) return;
  clearGroup(S_textG);
  var list = effFrases();
  if (!list.length) return;
  var f = fontById(state.font);
  var cols = palette(state.color);
  var rep = S_mobile ? 4 : 6;
  var all = [];
  for (var r=0;r<rep;r++) all = all.concat(list);
  for (var i=0;i<all.length;i++){
    var tex = textTex(all[i], cols[i % cols.length], f.css, f.w);
    var mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, alphaTest:0.01 });
    var sp  = new THREE.Sprite(mat);
    sp.scale.set(98, 12.25, 1);
    var phi = Math.acos(2*Math.random()-1), theta = Math.random()*Math.PI*2;
    var rad = S_rIn + Math.random()*(S_rOut - S_rIn - 30);
    sp.position.set(rad*Math.sin(phi)*Math.cos(theta), rad*Math.cos(phi), rad*Math.sin(phi)*Math.sin(theta));
    sp.userData = { phi:phi, theta:theta, radius:rad, speed:0.001 + Math.random()*0.001 };
    S_textG.add(sp);
  }
}

var photoLoaderLE = new THREE.TextureLoader();
var photoBuildToken = 0;
function rebuildFotos(){
  if (!S_photoG) return;
  photoBuildToken++;
  var token = photoBuildToken;
  clearGroup(S_photoG);
  var list = effFotos();
  if (!list.length) return;
  var rep = S_mobile ? (APP.photoRepeatM||6) : (APP.photoRepeatD||10);
  var base = S_mobile ? 32 : 44;
  var pg = glowTex(state.color, 512);
  var inst = [];
  for (var r=0;r<rep;r++) inst = inst.concat(list);
  inst.forEach(function(src){
    var phi = Math.acos(2*Math.random()-1), theta = Math.random()*Math.PI*2;
    var rad = S_rIn + Math.random()*(S_rOut - S_rIn - 30);
    var speed = 0.0007 + Math.random()*0.0009;

    if (APP.photoGlow){
      var gmat = new THREE.SpriteMaterial({ map:pg, transparent:true, depthWrite:false, opacity:0.6, blending:THREE.AdditiveBlending });
      var gs = new THREE.Sprite(gmat);
      gs.scale.set(base*1.6, base*1.6, 1);
      gs.position.set(rad*Math.sin(phi)*Math.cos(theta), rad*Math.cos(phi), rad*Math.sin(phi)*Math.sin(theta));
      gs.renderOrder = -1;
      gs.userData = { phi:phi, theta:theta, radius:rad, speed:speed, isGlow:true };
      S_photoG.add(gs);
    }

    photoLoaderLE.load(src, function(tex){
      if (token !== photoBuildToken) return;
      var iw = (tex.image && tex.image.width) || 1;
      var ih = (tex.image && tex.image.height) || 1;
      var ratio = iw/ih;
      var mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, opacity:0.95 });
      var sp = new THREE.Sprite(mat);
      if (ratio >= 1) sp.scale.set(base*ratio, base, 1); else sp.scale.set(base, base/ratio, 1);
      sp.position.set(rad*Math.sin(phi)*Math.cos(theta), rad*Math.cos(phi), rad*Math.sin(phi)*Math.sin(theta));
      sp.userData = { phi:phi, theta:theta, radius:rad, speed:speed, isPhoto:true };
      S_photoG.add(sp);
    }, undefined, function(){});
  });
}

function applyTitulo(){
  var el = document.getElementById("top-title");
  if (el) el.textContent = eff("titulo", "");
}
function applyTapText(){
  var el = document.getElementById("tap-text");
  if (!el) el = document.querySelector("#start-screen .pulse-text");
  if (el) el.textContent = eff("tapTexto", "Toca para iniciar");
}
function applyMensaje(){
  var body = document.getElementById("love-letter-body");
  if (!body) return;
  body.innerHTML = "";
  var txt = eff("mensaje", "");
  String(txt).split(/\n\s*\n/).forEach(function(par, i){
    var p = document.createElement("p");
    p.textContent = par.trim();
    p.className = "le-letter-p";
    p.style.animationDelay = (0.15 + i*0.16) + "s";
    body.appendChild(p);
  });
}
function applyMusica(){
  if (!S_audio) return;
  var m = effMusica();
  if (m){ if (S_audio.src !== m) { S_audio.src = m; S_audio.load(); } }
  else { try { S_audio.pause(); } catch(e){} S_audio.removeAttribute("src"); try{S_audio.load();}catch(e){} }
}

/* ============================================================
   EFECTOS: RÁFAGA AL TOCAR + RASTRO DEL PUNTERO
   ============================================================ */
var EFFECT_COLORS = palette(state.color);

function dustTex(){
  var size = 128;
  var c = document.createElement("canvas"); c.width=c.height=size;
  var ctx = c.getContext("2d");
  var gr = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,"rgba(255,255,255,1)");
  gr.addColorStop(0.35,"rgba(255,255,255,0.85)");
  gr.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=gr; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
var fxTex = S_dot || dustTex();

var BURST_POOL = S_mobile ? 260 : 420;
var TRAIL_POOL = S_mobile ? 140 : 220;
var burstPool = [], trailPool = [], burstCursor = 0, trailCursor = 0;

function makePool(arr, n){
  for (var i=0;i<n;i++){
    var m = new THREE.SpriteMaterial({ map:fxTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0 });
    var s = new THREE.Sprite(m);
    s.visible = false;
    s.userData = { alive:false, vel:new THREE.Vector3(), life:0, maxLife:1, baseScale:1 };
    S_scene.add(s);
    arr.push(s);
  }
}
makePool(burstPool, BURST_POOL);
makePool(trailPool, TRAIL_POOL);

function shapePoint(scale){
  var sh = state.shape || "heart";
  var t = Math.random()*Math.PI*2, x, y, j = 0.06;
  if (sh === "star"){
    var tot=10, va=Math.PI*2/tot, k=Math.floor(Math.random()*tot), f=Math.random();
    var r0=(k%2===0)?1:0.45, r1=((k+1)%2===0)?1:0.45;
    var a0=-Math.PI/2+k*va, a1=-Math.PI/2+(k+1)*va;
    var rr=r0+(r1-r0)*f, aa=a0+(a1-a0)*f;
    x=rr*Math.cos(aa); y=rr*Math.sin(aa);
  } else if (sh === "flower"){
    var rf = Math.cos(4*t);
    x = rf*Math.cos(t); y = rf*Math.sin(t);
  } else if (sh === "burst"){
    var rb = Math.sqrt(Math.random());
    x = rb*Math.cos(t); y = rb*Math.sin(t); j = 0.02;
  } else {
    x = Math.pow(Math.sin(t),3);
    y = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) / 16;
  }
  return { x:(x+(Math.random()-0.5)*j)*scale, y:(y+(Math.random()-0.5)*j)*scale };
}

function worldFromPointer(cx, cy, dist){
  var rect = S_canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  var nx = ((cx - rect.left)/rect.width)*2 - 1;
  var ny = -((cy - rect.top)/rect.height)*2 + 1;
  var v = new THREE.Vector3(nx, ny, 0.5).unproject(S_camera);
  var dir = v.sub(S_camera.position).normalize();
  return S_camera.position.clone().add(dir.multiplyScalar(dist));
}
function camDist(){ return (typeof currentDist !== "undefined") ? currentDist : 400; }

function spawnBurst(cx, cy){
  if (!state.burst) return;
  var pos = worldFromPointer(cx, cy, camDist()*0.5);
  if (!pos) return;
  var count = Math.max(10, Math.min(BURST_POOL, state.burstCount|0));
  var scale = camDist()*0.085;
  for (var n=0;n<count;n++){
    var s = burstPool[burstCursor];
    burstCursor = (burstCursor+1) % BURST_POOL;
    var p = shapePoint(scale);
    var off = new THREE.Vector3(p.x, p.y, (Math.random()-0.5)*scale*0.35);
    s.position.copy(pos).add(off);
    var out = off.lengthSq() > 0.0001 ? off.clone().normalize() : new THREE.Vector3(0,1,0);
    out.multiplyScalar(26 + Math.random()*34);
    s.userData.vel = out;
    s.userData.life = 1;
    s.userData.maxLife = 1.1 + Math.random()*0.7;
    s.userData.baseScale = (camDist()*0.011) * (0.7 + Math.random()*0.9);
    s.userData.alive = true;
    s.material.color.setStyle(EFFECT_COLORS[n % EFFECT_COLORS.length]);
    s.material.opacity = 1;
    s.visible = true;
    s.scale.set(1,1,1);
  }
}

var lastTX = null, lastTY = null;
function spawnTrail(cx, cy){
  var pos = worldFromPointer(cx, cy, camDist()*0.5);
  if (!pos) return;
  var s = trailPool[trailCursor];
  trailCursor = (trailCursor+1) % TRAIL_POOL;
  s.position.copy(pos);
  s.userData.vel = new THREE.Vector3((Math.random()-0.5)*7,(Math.random()-0.5)*7+2,(Math.random()-0.5)*7);
  s.userData.life = 1;
  s.userData.maxLife = 0.55 + Math.random()*0.45;
  s.userData.baseScale = (camDist()*0.008) * (0.6 + Math.random()*0.9);
  s.userData.alive = true;
  s.material.color.setStyle(EFFECT_COLORS[Math.floor(Math.random()*EFFECT_COLORS.length)]);
  s.material.opacity = 1;
  s.visible = true;
  s.scale.set(1,1,1);
}
function handleTrail(cx, cy){
  if (!state.trail) return;
  if (lastTX === null){ lastTX = cx; lastTY = cy; return; }
  if (Math.hypot(cx-lastTX, cy-lastTY) > 8){
    spawnTrail(cx, cy);
    lastTX = cx; lastTY = cy;
  }
}

function stepPool(arr, dt, drag){
  for (var i=0;i<arr.length;i++){
    var s = arr[i];
    if (!s.userData.alive) continue;
    s.userData.life -= dt / s.userData.maxLife;
    if (s.userData.life <= 0){ s.userData.alive = false; s.visible = false; s.material.opacity = 0; continue; }
    s.position.addScaledVector(s.userData.vel, dt);
    s.userData.vel.multiplyScalar(drag);
    var k = s.userData.life;
    s.material.opacity = k*k;
    var sc = s.userData.baseScale * (0.5 + k*0.9);
    s.scale.set(sc, sc, 1);
  }
}

var lastFrame = performance.now();
(function fxLoop(){
  requestAnimationFrame(fxLoop);
  var now = performance.now();
  var dt = Math.min(0.05, (now - lastFrame)/1000);
  lastFrame = now;
  stepPool(burstPool, dt, 0.94);
  stepPool(trailPool, dt, 0.92);
})();

/* ---------- entrada del puntero ---------- */
var downX=0, downY=0, downT=0, moved=0, isDown=false;
function started(){ return (typeof experienceStarted === "undefined") ? true : experienceStarted; }

function evXY(e){ var t = (e.touches && e.touches[0]) ? e.touches[0] : e; return { x:t.clientX, y:t.clientY }; }

function fxDown(e){
  if (mode !== "full" || !started()) return;
  if (e.target && e.target.closest && e.target.closest(".le-edit-toggle,#love-letter-btn,#love-letter-overlay")) return;
  var p = evXY(e); isDown = true; moved = 0; downX=p.x; downY=p.y; downT=performance.now();
}
function fxMove(e){
  if (mode !== "full" || !started()) return;
  var p = evXY(e);
  if (isDown) moved += Math.abs(p.x-downX)+Math.abs(p.y-downY);
  handleTrail(p.x, p.y);
}
function fxUp(e){
  if (mode !== "full" || !started()) return;
  if (!isDown) return;
  isDown = false;
  if (moved < 16 && (performance.now()-downT) < 550) spawnBurst(downX, downY);
}
window.addEventListener("mousedown", fxDown);
window.addEventListener("mousemove", fxMove);
window.addEventListener("mouseup", fxUp);
window.addEventListener("touchstart", fxDown, {passive:true});
window.addEventListener("touchmove", fxMove, {passive:true});
window.addEventListener("touchend", function(e){
  if (mode !== "full" || !started()) return;
  if (!isDown) return;
  isDown = false;
  if (moved < 16 && (performance.now()-downT) < 550) spawnBurst(downX, downY);
}, {passive:true});

var mode = "full";
S_canvas.classList.add("le-stage-full");

/* ============================================================
   ARRANQUE
   ============================================================ */
applyTitulo();
applyTapText();
applyMensaje();
applyMusica();
applyTheme();
(function(){
  var btn = document.getElementById("love-letter-btn");
  if (btn) btn.addEventListener("click", function(){ applyMensaje(); });
})();

function needsRebuild(){
  return (state.font !== (APP.defaultFont||"indie")) || (state.color !== (APP.defaultColor||""));
}
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){
    setTimeout(function(){ if (needsRebuild()) rebuildFrases(); }, 120);
  });
} else {
  setTimeout(function(){ if (needsRebuild()) rebuildFrases(); }, 600);
}

})();

</script>
<script>
/* ---- controles propios del Constelación de Amor ---- */
(function(){
  "use strict";
  var LE = window.LE_STATE; if (!LE) return;
  var st = LE.state;
  st.extra = st.extra || {};
  var ex = st.extra;
  var el = document.getElementById("le-initial-state");
  function persist(){ try { el.textContent = JSON.stringify(st); } catch(e){} }

  var FIGS = [
    {id:"corazon",  label:"Corazón",  icon:"\u2665"},
    {id:"anillos",  label:"Anillos",  icon:"\u25EF\u25EF"},
    {id:"infinito", label:"Infinito", icon:"\u221E"},
    {id:"estrella", label:"Estrella", icon:"\u2726"},
    {id:"flor",     label:"Flor",     icon:"\u2740"},
    {id:"luna",     label:"Luna",     icon:"\u263D"}
  ];
  ex.figuraA = ex.figuraA || "corazon";
  ex.figuraB = ex.figuraB || "estrella";
  if (ex.aurora         === undefined) ex.aurora = true;
  if (ex.constelaciones === undefined) ex.constelaciones = true;
  if (ex.trazar         === undefined) ex.trazar = true;
  if (ex.brillos        === undefined) ex.brillos = true;
  if (ex.fugaces        === undefined) ex.fugaces = true;

  function applyShapes(){ try { rebuildShapes(ex.figuraA, ex.figuraB); } catch(e){} }
  function applyRest(){
    try { if (typeof window.applyLoveState === "function") window.applyLoveState(ex); } catch(e){}
  }

  function buildRow(id, key){
    var row = document.getElementById(id);
    if (!row) return;
    FIGS.forEach(function(f){
      var d = document.createElement("div");
      d.className = "le-opt";
      d.setAttribute("data-fig", f.id);
      d.innerHTML = f.icon + "<small>" + f.label + "</small>";
      d.addEventListener("click", function(){
        ex[key] = f.id;
        refresh(row, key);
        applyShapes();
        persist();
      });
      row.appendChild(d);
    });
    refresh(row, key);
  }
  function refresh(row, key){
    Array.prototype.forEach.call(row.children, function(d){
      d.classList.toggle("active", d.getAttribute("data-fig") === ex[key]);
    });
  }
  buildRow("leFigA", "figuraA");
  buildRow("leFigB", "figuraB");

  function wireSwitch(id, key){
    var c = document.getElementById(id);
    if (!c) return;
    c.checked = !!ex[key];
    c.addEventListener("change", function(){ ex[key] = c.checked; applyRest(); persist(); });
  }
  wireSwitch("leAuroraOn", "aurora");
  wireSwitch("leConOn", "constelaciones");
  wireSwitch("leTraceOn", "trazar");
  wireSwitch("leGlowOn", "brillos");
  wireSwitch("leShootOn", "fugaces");

  applyRest();
  persist();
})();

</script>
