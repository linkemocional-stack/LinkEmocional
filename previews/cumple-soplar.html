<script id="st" type="application/json">{"titulo":"¡Feliz cumpleaños!","nombre":"Mi amor","tap":"Toca para encender las velas","velas":5,"color":"#ff8fb8","musica":"","mnom":"","mensaje":"Hoy el mundo celebra que existes, y yo celebro que te tengo.\n\nGracias por cada risa, cada abrazo y cada día a tu lado.\n\nPide un deseo… yo ya sé cuál es el mío: más años contigo. 🎂"}</script>
<script>
(function(){

if(an){an.getByteTimeDomainData(ad);var s=0;for(i=0;i<ad.length;i++){var v=(ad[i]-128)/128;s+=v*v}raw=Math.max(raw,Math.min(1,Math.max(0,Math.sqrt(s/ad.length)-.04)*5))}
L+=(raw-L)*.3;
K.forEach(function(c,i){c.lit=go&&!c.out&&T>c.t0;if(c.lit){lit++;if(L>.1){c.h-=(L-.1)*.04/c.th;if(c.h<=0)ext(c,i)}else c.h=Math.min(1,c.h+.01)}});
if(go&&!win&&K.length&&K.every(function(c){return c.out})&&T-lo>.9){win=1;wt=T;boom();$('md').classList.add('on');$('mb').style.display='block'}

ell(0,6,190,24,'#241a30');ell(0,2,185,22,'#e9e2f2');tier(300,90,0);tier(200,70,-90);
for(i=0;i<12;i++){ell(-138+i*25,-10-(i%2)*4,3.5,3.5,'rgba(255,255,255,.75)')}

K.forEach(function(c,i){if(!c.lit)return;var p=cp(i),fx=cx+p[0]*u,fy=by+(p[1]-47)*u,f=(1+.12*Math.sin(T*13+i*2)+.08*Math.sin(T*21+i))*(.6+.4*c.h),ln=L*9*u*(.7+.3*Math.sin(T*18+i));

requestAnimationFrame(fr)}
cv.addEventListener('pointerdown',function(e){K.forEach(function(c,i){if(!c.lit)return;var p=cp(i);if(Math.hypot(e.clientX-(cx+p[0]*u),e.clientY-(by+(p[1]-40)*u))<30*u)ext(c,i)})});
var bt=$('blow');bt.addEventListener('pointerdown',function(){fb=1});['pointerup','pointerleave','pointercancel'].forEach(function(n){bt.addEventListener(n,function(){fb=0})});

(function(){

/* vista previa: dedo fantasma (hace lo que haria el cliente) */
(function(){

function pe(type,x,y,target){ var ev; try{ ev=new PointerEvent(type,{clientX:x,clientY:y,pointerId:1,bubbles:true,cancelable:true,isPrimary:true,pointerType:'touch'}); }catch(e){ return; } (target||window).dispatchEvent(ev); }

var blow=document.getElementById('blow'), md=document.getElementById('md');
function cycle(){
  // sopla ~1.6 s, las velas se apagan; despues vuelve a encenderlas
  setTimeout(function(){ blow.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})); },3400);
  setTimeout(function(){ blow.dispatchEvent(new PointerEvent('pointerup',{bubbles:true})); },3400+1700);
  setTimeout(function(){ var r=document.getElementById('mr'); if(r) r.click(); },3400+1700+4200);
  setTimeout(cycle,3400+1700+4200+300);
}
