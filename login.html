<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión | Link Emocional</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="og-image.jpg">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="stars"></canvas>
<header id="top"></header>
<main class="page">
  <h1 class="t" id="ttl">Entrá a tu <em>cuenta</em></h1>
  <p class="sub" id="sub">Guardá tus páginas, editalas cuando quieras y creá todas las que necesites.</p>

  <div id="msg"></div>

  <section class="card" id="boxLogin">
    <button class="btn google" id="bGoogle">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuar con Google
    </button>
    <div class="sep">o con tu correo</div>

    <div id="nameWrap" class="hidden">
      <label class="l" for="name">Tu nombre</label>
      <input class="in" id="name" autocomplete="name" maxlength="60" placeholder="Cómo te llamás">
    </div>
    <label class="l" for="email">Correo electrónico</label>
    <input class="in" id="email" type="email" autocomplete="email" inputmode="email" placeholder="tucorreo@gmail.com">
    <label class="l" for="pass">Contraseña</label>
    <input class="in" id="pass" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
    <p style="margin:12px 0 16px"><a href="#" id="forgot" style="font-size:13px;font-weight:700">¿Olvidaste tu contraseña?</a></p>
    <button class="btn" id="bGo">Iniciar sesión</button>
    <p class="muted center" style="margin:16px 0 0"><span id="swTxt">¿No tenés cuenta?</span> <a href="#" id="swBtn" style="font-weight:800">Registrate</a></p>
  </section>

  <section class="card hidden" id="boxReset">
    <h2>Elegí tu nueva contraseña</h2>
    <label class="l" for="np">Nueva contraseña</label>
    <input class="in" id="np" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
    <div style="height:14px"></div>
    <button class="btn" id="bSave">Guardar contraseña</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  LE.header('');
  var $ = function (i) { return document.getElementById(i); };
  var qs = new URLSearchParams(location.search);
  var next = LE.safeNext(qs.get('next'), 'mis-paginas.html');
  var mode = qs.get('register') ? 'register' : 'login';
  var recovering = !!qs.get('reset') || /type=recovery/.test(location.hash);
  var went = false;

  function say(kind, text) { $('msg').innerHTML = text ? '<div class="alert ' + kind + '">' + LE.esc(text) + '</div>' : ''; }
  function human(m) {
    m = String(m || '');
    if (/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/already registered/i.test(m)) return 'Ese correo ya tiene cuenta. Iniciá sesión.';
    if (/at least 6/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
    if (/valid email|invalid.*email/i.test(m)) return 'Revisá que el correo esté bien escrito.';
    if (/not confirmed/i.test(m)) return 'Primero confirmá tu correo (te enviamos un enlace).';
    if (/rate limit|too many/i.test(m)) return 'Demasiados intentos. Esperá unos minutos.';
    if (/provider is not enabled/i.test(m)) return 'El ingreso con Google todavía no está activado.';
    return m || 'No se pudo completar. Probá de nuevo.';
  }
  function setMode(m) {
    mode = m;
    var reg = m === 'register';
    $('nameWrap').classList.toggle('hidden', !reg);
    $('bGo').textContent = reg ? 'Crear mi cuenta' : 'Iniciar sesión';
    $('swTxt').textContent = reg ? '¿Ya tenés cuenta?' : '¿No tenés cuenta?';
    $('swBtn').textContent = reg ? 'Iniciá sesión' : 'Registrate';
    $('pass').autocomplete = reg ? 'new-password' : 'current-password';
    $('ttl').innerHTML = reg ? 'Creá tu <em>cuenta</em>' : 'Entrá a tu <em>cuenta</em>';
    $('forgot').parentNode.classList.toggle('hidden', reg);
  }
  function go() { if (went) return; went = true; location.href = next; }

  if (qs.get('reason') === 'limit') say('bad', 'Has alcanzado el límite de páginas sin cuenta. Iniciá sesión para seguir creando más páginas.');
  if (!LE.configured) {
    say('bad', 'Falta configurar Supabase en config.js (SUPABASE_URL y SUPABASE_ANON_KEY). Mirá el LEEME.');
    ['bGoogle', 'bGo'].forEach(function (i) { $(i).disabled = true; });
  }
  setMode(mode);
  $('swBtn').onclick = function (e) { e.preventDefault(); say('', ''); setMode(mode === 'login' ? 'register' : 'login'); };

  function showReset() { $('boxLogin').classList.add('hidden'); $('boxReset').classList.remove('hidden'); $('ttl').innerHTML = 'Nueva <em>contraseña</em>'; $('sub').textContent = 'Casi listo: elegí una contraseña nueva.'; }
  if (recovering) showReset();

  if (LE.sb) {
    LE.sb.auth.onAuthStateChange(function (ev) {
      if (ev === 'PASSWORD_RECOVERY') { recovering = true; showReset(); }
      else if (ev === 'SIGNED_IN' && !recovering) go();
    });
    LE.session().then(function (s) { if (s && !recovering) go(); });
  }

  $('bGoogle').onclick = function () {
    say('', '');
    LE.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: new URL('login.html?next=' + encodeURIComponent(next), location.href).href } })
      .then(function (r) { if (r.error) say('bad', human(r.error.message)); });
  };

  $('bGo').onclick = function () {
    var email = $('email').value.trim(), pass = $('pass').value;
    if (!email || !pass) return say('bad', 'Escribí tu correo y tu contraseña.');
    say('', ''); $('bGo').disabled = true;
    var p;
    if (mode === 'register') {
      p = LE.sb.auth.signUp({ email: email, password: pass, options: { data: { name: $('name').value.trim() }, emailRedirectTo: new URL('login.html?next=' + encodeURIComponent(next), location.href).href } })
        .then(function (r) {
          if (r.error) throw r.error;
          if (!r.data.session) { say('ok', 'Te enviamos un correo para confirmar tu cuenta. Revisá también la carpeta de spam.'); $('bGo').disabled = false; }
        });
    } else {
      p = LE.sb.auth.signInWithPassword({ email: email, password: pass }).then(function (r) { if (r.error) throw r.error; });
    }
    p.catch(function (e) { say('bad', human(e.message)); $('bGo').disabled = false; });
  };
  [$('email'), $('pass')].forEach(function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('bGo').click(); }); });

  $('forgot').onclick = function (e) {
    e.preventDefault();
    var email = $('email').value.trim();
    if (!email) return say('bad', 'Escribí tu correo arriba y tocá de nuevo “¿Olvidaste tu contraseña?”.');
    LE.sb.auth.resetPasswordForEmail(email, { redirectTo: new URL('login.html?reset=1', location.href).href })
      .then(function (r) { if (r.error) say('bad', human(r.error.message)); else say('ok', 'Listo. Te enviamos un correo con el enlace para crear una nueva contraseña.'); });
  };

  $('bSave').onclick = function () {
    var p = $('np').value;
    if (p.length < 6) return say('bad', 'La contraseña debe tener al menos 6 caracteres.');
    LE.sb.auth.updateUser({ password: p }).then(function (r) {
      if (r.error) return say('bad', human(r.error.message));
      say('ok', 'Contraseña actualizada ✓'); recovering = false; setTimeout(go, 900);
    });
  };
})();
</script>
</body>
</html>
